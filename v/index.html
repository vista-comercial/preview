<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F6F5F0" />
  <title>Website Preview</title>
  <meta name="description" content="Local services, real prices and an instant online estimate." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='16' fill='%23112A20'/%3E%3Cpath d='M16 7c5 3 7 7 5 12-1 3-3 5-5 6-2-1-4-3-5-6-2-5 0-9 5-12z' fill='%23D9A05B'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* =========================================================
       PLANTILLA MAESTRA UNIVERSAL · 9 giros de EE. UU. (editorial orgánico)
       Paleta: hueso #F6F5F0 · verde bosque #112A20 · ocre #D9A05B
       ========================================================= */
    :root {
      --bone: #F6F5F0; --bone-2: #EDEBE3; --paper: #FBFAF7;
      --forest: #112A20; --forest-2: #1A3A2C; --forest-3: #0B1D16;
      --ochre: #D9A05B; --ochre-2: #C88B44; --ochre-soft: rgba(217,160,91,.14);
      --ink: #15201B; --muted: #5B655F; --muted-d: rgba(246,245,240,.66);
      --line: rgba(17,42,32,.11); --line-2: rgba(17,42,32,.18); --line-d: rgba(246,245,240,.14);
      --bad: #B5452E; --good: #1E7A4C;
      --serif: "Instrument Serif", "Playfair Display", Georgia, serif;
      --sans: "Plus Jakarta Sans", Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      --r-sm: 12px; --r: 18px; --r-lg: 24px; --r-xl: 32px;
      --shadow: 0 1px 2px rgba(17,42,32,.05), 0 18px 40px -22px rgba(17,42,32,.35);
      --ease: cubic-bezier(.22,.8,.24,1);
      --obh: 0px; --abh: 0px;
      color-scheme: light;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { overflow-x: hidden; scroll-behavior: smooth; scroll-padding-top: calc(96px + var(--obh)); -webkit-text-size-adjust: 100%; }
    body { margin: 0; background: var(--bone); color: var(--ink); font: 400 16px/1.6 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
    body.pre { padding-bottom: var(--abh); }
    img { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; background: none; border: 0; padding: 0; }
    :focus-visible { outline: 2px solid var(--ochre); outline-offset: 3px; border-radius: 8px; }
    .wrap { width: min(1180px, 100% - 32px); margin-inline: auto; }
    .ic { width: 1.15em; height: 1.15em; flex-shrink: 0; }
    [hidden] { display: none !important; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* ---------- tipografía ---------- */
    .serif { font-family: var(--serif); font-weight: 400; letter-spacing: -.01em; }
    h1, h2, h3 { margin: 0; font-family: var(--serif); font-weight: 400; line-height: 1; letter-spacing: -.015em; }
    h1 em, h2 em, h3 em, .brand-xl em { font-style: italic; color: var(--forest-2); }
    .dark h2 em, .dark .brand-xl em { color: var(--ochre); }
    .h2 { font-size: clamp(40px, 6.2vw, 76px); }
    .eyebrow { display: inline-flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
    .eyebrow::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ochre); box-shadow: 0 0 0 4px var(--ochre-soft); }
    .dark .eyebrow { color: var(--muted-d); }
    .lead { font-size: clamp(16px, 1.6vw, 19px); color: var(--muted); max-width: 54ch; }
    .dark .lead { color: var(--muted-d); }
    .sec { padding: clamp(80px, 11vw, 140px) 0; position: relative; }
    .sec-head { display: flex; justify-content: space-between; align-items: end; gap: 24px 40px; flex-wrap: wrap; margin-bottom: clamp(32px, 5vw, 56px); }
    .sec-head > * { min-width: 0; max-width: 100%; }
    .sec-head .h2 { margin-top: 18px; max-width: 14ch; }
    .dark { background: var(--forest); color: var(--bone); }

    /* ---------- botones (estilo shadcn) ---------- */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 52px; padding: 0 24px; border-radius: 999px;
           font: 700 15px/1 var(--sans); letter-spacing: -.005em; white-space: nowrap; transition: transform .25s var(--ease), background .25s, box-shadow .25s, color .25s, border-color .25s; }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: var(--ochre); color: var(--forest-3); box-shadow: 0 1px 0 rgba(255,255,255,.35) inset, 0 10px 24px -10px rgba(200,139,68,.8); }
    .btn-primary:hover { background: #E1AC6C; transform: translateY(-1px); }
    .btn-ghost { border: 1px solid var(--line-2); background: rgba(255,255,255,.5); color: var(--forest); }
    .btn-ghost:hover { background: #fff; border-color: rgba(17,42,32,.3); }
    .dark .btn-ghost { background: rgba(246,245,240,.06); border-color: var(--line-d); color: var(--bone); }
    .dark .btn-ghost:hover { background: rgba(246,245,240,.12); }
    .btn .arr { transition: transform .3s var(--ease); }
    .btn:hover .arr { transform: translateX(3px); }
    .btn[disabled] { opacity: .4; pointer-events: none; }
    .wa-svg { width: 1.2em; height: 1.2em; fill: currentColor; flex-shrink: 0; }

    /* ---------- barra flotante tipo cápsula (glassmorphism) ---------- */
    .nav { position: fixed; z-index: 60; top: max(12px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
           width: min(1120px, 100% - 24px); height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 8px 0 10px; border-radius: 999px;
           background: rgba(246,245,240,.68); border: 1px solid rgba(17,42,32,.1);
           backdrop-filter: blur(18px) saturate(170%); -webkit-backdrop-filter: blur(18px) saturate(170%);
           box-shadow: 0 1px 0 rgba(255,255,255,.7) inset, 0 12px 32px -18px rgba(17,42,32,.35); transition: background .3s, box-shadow .3s, top .3s; }
    body.pre .nav { top: calc(var(--obh) + 10px); }
    .nav.scrolled { background: rgba(246,245,240,.82); }
    .logo { display: flex; align-items: center; gap: 10px; min-width: 0; margin-right: auto; }
    .logo-mark { width: 42px; height: 42px; border-radius: 50%; background: var(--forest); color: var(--ochre); display: grid; place-items: center; flex-shrink: 0; }
    .logo-mark .ic { width: 21px; height: 21px; stroke-width: 1.8; }
    .logo b { min-width: 0; font: 400 22px/1 var(--serif); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -.01em; }
    .nav-links { display: none; gap: 4px; font-size: 14px; font-weight: 600; color: var(--muted); }
    .nav-links a { padding: 8px 14px; border-radius: 999px; transition: background .2s, color .2s; }
    .nav-links a:hover { background: rgba(17,42,32,.06); color: var(--forest); }
    .lang { position: relative; display: inline-grid; grid-template-columns: repeat(3, 1fr); height: 40px; padding: 4px; border-radius: 999px; background: rgba(17,42,32,.07);
            font: 800 12px/1 var(--sans); letter-spacing: .06em; flex-shrink: 0; }
    .lang button { position: relative; z-index: 1; display: grid; place-items: center; width: 38px; color: var(--muted); font: inherit; letter-spacing: inherit; transition: color .3s; }
    .lang button[aria-pressed="true"] { color: var(--forest); }
    .lang::before { content: ""; position: absolute; top: 4px; bottom: 4px; left: 4px; width: 38px; border-radius: 999px; background: #fff;
                    box-shadow: 0 1px 3px rgba(17,42,32,.18); transition: transform .35s var(--ease); }
    .lang[data-i="1"]::before { transform: translateX(38px); }
    .lang[data-i="2"]::before { transform: translateX(76px); }
    .call { height: 46px; padding: 0 18px 0 14px; font-size: 14px; }
    .call .txt { display: none; }
    .call { width: 46px; padding: 0; }

    /* ---------- portada ---------- */
    .hero { padding: 120px 0 clamp(64px, 9vw, 110px); position: relative; overflow: hidden; }
    body.pre .hero { padding-top: calc(120px + var(--obh)); }
    .hero::before { content: ""; position: absolute; inset: auto -20% 30% auto; width: 620px; height: 620px; border-radius: 50%;
                    background: radial-gradient(closest-side, rgba(217,160,91,.18), transparent); pointer-events: none; }
    .hero-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 44px; align-items: center; }
    .g-badge { display: inline-flex; align-items: center; gap: 10px; padding: 7px 14px 7px 8px; border-radius: 999px; background: #fff; border: 1px solid var(--line);
               box-shadow: var(--shadow); font-size: 13px; font-weight: 600; color: var(--muted); max-width: 100%; flex-wrap: wrap; row-gap: 2px; }
    .g-badge .g { width: 28px; height: 28px; border-radius: 50%; background: var(--bone); display: grid; place-items: center; flex-shrink: 0; }
    .g-badge b { color: var(--ink); font-weight: 800; }
    .stars { display: inline-flex; gap: 1px; color: #F4B400; }
    .stars svg { width: 13px; height: 13px; fill: currentColor; }
    .stars .off { opacity: .25; }
    .hero h1 { font-size: clamp(54px, 9.4vw, 116px); line-height: .94; margin: 26px 0 24px; letter-spacing: -.025em; }
    .hero .cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px; }
    .trust { display: flex; flex-wrap: wrap; gap: 10px 22px; margin-top: 30px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
    .trust span { display: inline-flex; align-items: center; gap: 7px; }
    .trust .ic { color: var(--forest-2); }
    .hero-visual { position: relative; }
    .hero-img { position: relative; border-radius: var(--r-xl); overflow: hidden; aspect-ratio: 4 / 4.6; background: var(--bone-2); box-shadow: 0 40px 80px -40px rgba(17,42,32,.55); }
    .hero-img img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.04); animation: settle 1.8s var(--ease) forwards; }
    @keyframes settle { to { transform: scale(1); } }
    .chip-float { position: absolute; top: 18px; right: 18px; display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px;
                  background: rgba(17,42,32,.45); color: #fff; border: 1px solid rgba(255,255,255,.2); font-size: 12.5px; font-weight: 700;
                  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    .pulse { width: 8px; height: 8px; border-radius: 50%; background: #7BE0A5; box-shadow: 0 0 0 0 rgba(123,224,165,.7); animation: pulse 2s infinite; flex-shrink: 0; }
    @keyframes pulse { 70% { box-shadow: 0 0 0 9px rgba(123,224,165,0); } 100% { box-shadow: 0 0 0 0 rgba(123,224,165,0); } }
    .metrics { position: relative; margin: -70px 14px 0; z-index: 2; border-radius: var(--r-lg); padding: 20px 8px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
               background: rgba(17,42,32,.9); color: var(--bone); border: 1px solid rgba(255,255,255,.1);
               backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 24px 48px -24px rgba(11,29,22,.7); }
    .metrics > div { padding: 2px 12px; text-align: center; }
    .metrics > div + div { border-left: 1px solid var(--line-d); }
    .metrics strong { display: block; font: 400 clamp(34px, 4.4vw, 48px)/1 var(--serif); color: var(--ochre); white-space: nowrap; }
    .metrics span { display: block; margin-top: 6px; font-size: 11.5px; font-weight: 600; letter-spacing: .04em; color: var(--muted-d); line-height: 1.3; }

    /* ---------- galería bento ---------- */
    .tabs { display: inline-flex; gap: 4px; padding: 5px; border-radius: 999px; background: rgba(17,42,32,.06); border: 1px solid var(--line);
            max-width: 100%; overflow-x: auto; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 999px; font-size: 14px; font-weight: 700; color: var(--muted);
           white-space: nowrap; transition: background .25s, color .25s, box-shadow .25s; }
    .tab small { font-size: 11px; font-weight: 800; min-width: 22px; height: 20px; padding: 0 6px; border-radius: 999px; display: grid; place-items: center; background: rgba(17,42,32,.07); }
    .tab[aria-selected="true"] { background: #fff; color: var(--forest); box-shadow: 0 1px 3px rgba(17,42,32,.14), 0 4px 12px -6px rgba(17,42,32,.2); }
    .tab[aria-selected="true"] small { background: var(--ochre); color: var(--forest-3); }
    .bento { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 170px; gap: 12px; grid-auto-flow: dense; }
    .tile { position: relative; margin: 0; border-radius: var(--r-lg); overflow: hidden; background: var(--bone-2); isolation: isolate;
            transition: opacity .35s var(--ease), transform .45s var(--ease); }
    .tile.big { grid-column: span 2; grid-row: span 2; }
    .tile.wide { grid-column: span 2; }
    .tile.tall { grid-row: span 2; }
    .tile.out, .js .tile.rv.out { opacity: 0; transform: scale(.96); }
    .tile[hidden] { display: none; }
    .tile img { width: 100%; height: 100%; object-fit: cover; transition: transform 1.1s var(--ease); }
    .tile::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 55%, rgba(11,29,22,.55)); opacity: .7; transition: opacity .5s; z-index: 1; }
    .tile:hover img { transform: scale(1.07); }
    .tile:hover::after { opacity: 1; }
    .tag { position: absolute; z-index: 2; top: 12px; left: 12px; display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px;
           background: rgba(17,42,32,.34); color: #fff; border: 1px solid rgba(255,255,255,.26); text-shadow: 0 1px 2px rgba(0,0,0,.25); font-size: 11.5px; font-weight: 700; letter-spacing: .02em;
           backdrop-filter: blur(14px) saturate(160%); -webkit-backdrop-filter: blur(14px) saturate(160%); }
    .tag i { width: 6px; height: 6px; border-radius: 50%; background: var(--ochre); }
    .tile figcaption { position: absolute; z-index: 2; left: 16px; right: 16px; bottom: 14px; color: #fff; font: 400 clamp(19px, 2vw, 26px)/1.1 var(--serif);
                       display: flex; justify-content: space-between; align-items: end; gap: 10px; }
    .tile figcaption .go { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.18); flex-shrink: 0;
                           backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transform: translateY(6px); opacity: 0; transition: .4s var(--ease); }
    .tile:hover .go { transform: none; opacity: 1; }

    /* ---------- antes y después ---------- */
    .ba-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 40px; align-items: center; }
    .ba { position: relative; border-radius: var(--r-xl); overflow: hidden; aspect-ratio: 4 / 4.4; user-select: none; -webkit-user-select: none;
          touch-action: pan-y; cursor: ew-resize; background: var(--forest-3); --pos: 50%; box-shadow: 0 40px 80px -40px rgba(0,0,0,.6); }
    .ba img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; -webkit-user-drag: none; }
    .ba .before { clip-path: inset(0 calc(100% - var(--pos)) 0 0); }
    .ba .line { position: absolute; top: 0; bottom: 0; left: var(--pos); width: 2px; margin-left: -1px; background: rgba(255,255,255,.9); box-shadow: 0 0 16px rgba(0,0,0,.35); pointer-events: none; }
    .ba .knob { position: absolute; top: 50%; left: var(--pos); width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; display: grid; place-items: center;
                background: rgba(246,245,240,.9); color: var(--forest); border: 1px solid rgba(255,255,255,.8); box-shadow: 0 10px 28px rgba(0,0,0,.35);
                backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: transform .2s var(--ease); }
    .ba.drag .knob { transform: scale(1.08); }
    .ba .knob .ic { width: 22px; height: 22px; }
    .ba .lbl { position: absolute; bottom: 16px; z-index: 2; padding: 7px 14px; border-radius: 999px; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
               background: rgba(17,42,32,.5); color: #fff; border: 1px solid rgba(255,255,255,.2); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); pointer-events: none; }
    .ba .lbl.l { left: 16px; } .ba .lbl.r { right: 16px; background: rgba(217,160,91,.85); color: var(--forest-3); border-color: transparent; }
    .ba-hint { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); z-index: 2; padding: 7px 14px; border-radius: 999px; font-size: 12px; font-weight: 700;
               background: rgba(246,245,240,.85); color: var(--forest); pointer-events: none; transition: opacity .4s; white-space: nowrap; }
    .ba.used .ba-hint { opacity: 0; }
    .facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 36px; border-top: 1px solid var(--line-d); }
    .facts div { padding: 20px 14px 0 0; }
    .facts strong { display: block; font: 400 clamp(28px, 3.4vw, 40px)/1 var(--serif); color: var(--bone); }
    .facts span { display: block; margin-top: 8px; font-size: 12.5px; color: var(--muted-d); font-weight: 600; }

    /* ---------- reseñas ---------- */
    .rev-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
    .rev { position: relative; margin: 0; background: #fff; border: 1px solid var(--line); border-radius: var(--r-lg); padding: 24px 22px 20px;
           display: flex; flex-direction: column; gap: 16px; box-shadow: var(--shadow); min-width: 0; }
    .rev .q { position: absolute; top: 18px; right: 18px; width: 34px; height: 34px; color: rgba(217,160,91,.4); }
    .rev .stars svg { width: 15px; height: 15px; }
    .rev blockquote { margin: 0; font: 400 clamp(20px, 2vw, 23px)/1.32 var(--serif); color: var(--ink); overflow-wrap: anywhere; }
    .rev figcaption { display: flex; align-items: center; gap: 12px; margin-top: auto; padding-top: 14px; border-top: 1px solid var(--line); min-width: 0; }
    .rev .av { width: 40px; height: 40px; border-radius: 50%; background: var(--forest); color: var(--ochre); display: grid; place-items: center; font: 400 20px/1 var(--serif); flex-shrink: 0; }
    .rev figcaption b { display: block; font-size: 14.5px; }
    .rev figcaption small { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); font-weight: 600; }
    .rev-note { display: flex; gap: 8px; align-items: flex-start; margin: 18px 0 0; font-size: 13px; color: var(--muted); font-weight: 600; }
    .rev-note .ic { color: var(--ochre-2); margin-top: 2px; }

    /* ---------- ficha vs competencia (solo vista previa) ---------- */
    .audit { background: #fff; border: 1px solid var(--line); border-radius: var(--r-xl); padding: clamp(20px, 3.4vw, 36px);
             box-shadow: 0 1px 0 #fff inset, 0 30px 60px -44px rgba(17,42,32,.45); margin-bottom: clamp(48px, 7vw, 88px); }
    .audit-t { font-size: clamp(30px, 4.4vw, 48px); margin: 14px 0 24px; overflow-wrap: anywhere; }
    .audit-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; align-items: stretch; }
    .ac { border-radius: var(--r-lg); padding: 18px; border: 1px solid; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
    .ac.me { background: #FFF5F1; border-color: rgba(181,69,46,.22); }
    .ac.them { background: #F0F7F2; border-color: rgba(30,122,76,.22); }
    .ac-lbl { font-size: 11.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    .ac-name { display: block; font: 400 26px/1.1 var(--serif); margin-top: 6px; overflow-wrap: anywhere; }
    .ac-rate { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
    .ac-rate b { color: var(--ink); font-weight: 800; }
    .ac ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 14px; font-weight: 700; }
    .ac li { display: flex; gap: 8px; align-items: center; }
    .ac li .ic { width: 18px; height: 18px; }
    .ac .bad { color: var(--bad); } .ac .good { color: var(--good); }
    .ac-s { margin: 0; font-size: 13.5px; color: var(--muted); }
    .vs { justify-self: center; align-self: center; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--forest); color: var(--ochre);
          font: italic 400 18px/1 var(--serif); margin: -22px 0; position: relative; z-index: 1; box-shadow: 0 0 0 6px #fff; }
    .audit-foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 14px 24px; margin-top: 22px; padding-top: 20px; border-top: 1px dashed var(--line-2); }
    .audit-foot p { margin: 0; max-width: 56ch; font-weight: 600; font-size: 15px; }

    /* ---------- cotizador (estilo Lovable) ---------- */
    .q-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 40px; align-items: start; }
    .q-aside .h2 { margin: 18px 0 20px; }
    .q-list { list-style: none; padding: 0; margin: 28px 0 0; display: grid; gap: 14px; }
    .q-list li { display: flex; gap: 12px; align-items: center; font-weight: 600; font-size: 15px; }
    .q-list .ic { width: 30px; height: 30px; padding: 7px; border-radius: 50%; background: var(--ochre-soft); color: var(--ochre-2); }
    .card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-xl); box-shadow: 0 1px 0 #fff inset, 0 40px 80px -48px rgba(17,42,32,.45); overflow: hidden; }
    .q-top { padding: 22px clamp(18px, 3vw, 30px) 0; }
    .steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .step-dot { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; color: var(--muted); min-width: 0; }
    .step-dot b { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; font-size: 12px; border: 1px solid var(--line-2); background: #fff; transition: .3s; }
    .step-dot span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .step-dot.on { color: var(--forest); }
    .step-dot.on b { background: var(--forest); color: var(--bone); border-color: var(--forest); }
    .step-dot.done b { background: var(--ochre); border-color: var(--ochre); color: var(--forest-3); }
    .bar { height: 4px; border-radius: 99px; background: rgba(17,42,32,.08); margin-top: 18px; overflow: hidden; }
    .bar i { display: block; height: 100%; width: 33.33%; background: linear-gradient(90deg, var(--forest-2), var(--ochre)); border-radius: inherit; transition: width .6s var(--ease); }
    .q-body { padding: clamp(22px, 3vw, 32px) clamp(18px, 3vw, 30px); min-height: 430px; }
    .pane { display: none; animation: paneIn .5s var(--ease); }
    .pane.on { display: block; }
    @keyframes paneIn { from { opacity: 0; transform: translateY(12px); } }
    .pane h3 { font-size: clamp(28px, 3.2vw, 36px); }
    .pane .sub { margin: 8px 0 22px; color: var(--muted); font-size: 14.5px; }
    .svc { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .opt { position: relative; text-align: left; padding: 16px; border-radius: var(--r); background: #fff; border: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px;
           transition: border-color .2s, box-shadow .25s, transform .25s var(--ease), background .2s; }
    .opt:hover { border-color: var(--line-2); transform: translateY(-2px); box-shadow: 0 12px 24px -16px rgba(17,42,32,.35); }
    .opt .oi { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: var(--bone); color: var(--forest-2); transition: .25s; }
    .opt .oi .ic { width: 21px; height: 21px; }
    .opt b { font-size: 14.5px; line-height: 1.25; }
    .opt small { font-size: 12.5px; color: var(--muted); font-weight: 600; }
    .opt .tick { position: absolute; top: 12px; right: 12px; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line-2); display: grid; place-items: center; color: transparent; transition: .25s; }
    .opt .tick .ic { width: 13px; height: 13px; stroke-width: 3; }
    .opt[aria-checked="true"] { border-color: var(--ochre); background: #FFFBF4; box-shadow: 0 0 0 3px var(--ochre-soft), 0 12px 24px -16px rgba(200,139,68,.6); }
    .opt[aria-checked="true"] .oi { background: var(--forest); color: var(--ochre); }
    .opt[aria-checked="true"] .tick { background: var(--ochre); border-color: var(--ochre); color: var(--forest-3); }
    .field-lbl { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 13px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    .sqft-val { font: 400 clamp(44px, 6vw, 60px)/1 var(--serif); color: var(--forest); margin: 12px 0 6px; letter-spacing: -.02em; }
    .sqft-val small { font: 700 15px var(--sans); color: var(--muted); margin-left: 6px; letter-spacing: 0; }
    .range { -webkit-appearance: none; appearance: none; width: 100%; height: 32px; background: transparent; margin: 4px 0; touch-action: pan-y; --p: 30%; }
    .range::-webkit-slider-runnable-track { height: 8px; border-radius: 99px; background: linear-gradient(90deg, var(--forest-2) 0 var(--p), rgba(17,42,32,.1) var(--p) 100%); }
    .range::-moz-range-track { height: 8px; border-radius: 99px; background: rgba(17,42,32,.1); }
    .range::-moz-range-progress { height: 8px; border-radius: 99px; background: var(--forest-2); }
    .range::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; margin-top: -10px; border-radius: 50%; background: #fff; border: 2px solid var(--ochre);
                                   box-shadow: 0 0 0 6px var(--ochre-soft), 0 4px 10px rgba(17,42,32,.25); transition: transform .2s; }
    .range::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; background: #fff; border: 2px solid var(--ochre); box-shadow: 0 0 0 6px var(--ochre-soft), 0 4px 10px rgba(17,42,32,.25); }
    .range:active::-webkit-slider-thumb { transform: scale(1.12); }
    .r-ends { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--muted); }
    .presets { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 28px; }
    .chip { height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-2); background: #fff; font-size: 13px; font-weight: 700; color: var(--muted); transition: .2s; }
    .chip:hover { color: var(--forest); border-color: var(--forest-2); }
    .chip.on { background: var(--forest); color: var(--bone); border-color: var(--forest); }
    .urg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
    .urg .opt { padding: 13px 12px; gap: 6px; align-items: flex-start; }
    .urg .opt .oi { width: 34px; height: 34px; border-radius: 10px; }
    .urg .opt .oi .ic { width: 17px; height: 17px; }
    .urg .opt b { font-size: 13.5px; }
    .urg .opt small { font-size: 11.5px; }
    .live { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 24px; padding: 14px 16px; border-radius: var(--r); background: var(--bone); border: 1px dashed var(--line-2); }
    .live span { font-size: 12.5px; font-weight: 700; color: var(--muted); }
    .live b { font: 400 24px/1 var(--serif); color: var(--forest); white-space: nowrap; }
    .result { border-radius: var(--r-lg); background: var(--forest); color: var(--bone); padding: 24px; position: relative; overflow: hidden; }
    .result::before { content: ""; position: absolute; width: 300px; height: 300px; right: -120px; top: -140px; border-radius: 50%; background: radial-gradient(closest-side, rgba(217,160,91,.35), transparent); }
    .result .k { position: relative; font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--muted-d); }
    .result .price { position: relative; font: 400 clamp(40px, 6.4vw, 64px)/1 var(--serif); color: var(--ochre); margin: 12px 0 18px; letter-spacing: -.02em; }
    .result .price span { color: var(--muted-d); font-size: .6em; margin: 0 .15em; }
    .summary { position: relative; list-style: none; padding: 16px 0 0; margin: 0; border-top: 1px solid var(--line-d); display: grid; gap: 9px; font-size: 14px; }
    .summary li { display: flex; justify-content: space-between; gap: 16px; }
    .summary li span { color: var(--muted-d); }
    .summary li b { font-weight: 700; text-align: right; }
    .note { font-size: 12.5px; color: var(--muted); margin: 14px 2px 18px; }
    .inp { width: 100%; height: 50px; padding: 0 16px; border-radius: 14px; border: 1px solid var(--line-2); background: #fff; font-size: 15px; transition: border-color .2s, box-shadow .2s; }
    .inp:focus { outline: none; border-color: var(--forest-2); box-shadow: 0 0 0 4px rgba(26,58,44,.1); }
    .send { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
    .send.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .send a { height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-radius: 14px; font-size: 12.5px; font-weight: 800;
              border: 1px solid var(--line-2); background: #fff; color: var(--forest); transition: .2s var(--ease); }
    .send a .ic, .send a .wa-svg { width: 19px; height: 19px; }
    .send a:hover { transform: translateY(-2px); border-color: var(--forest-2); box-shadow: 0 10px 20px -14px rgba(17,42,32,.5); }
    .send a.main { background: var(--ochre); border-color: var(--ochre); color: var(--forest-3); }
    .q-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px clamp(18px, 3vw, 30px); border-top: 1px solid var(--line); background: rgba(246,245,240,.6); }
    .q-foot .btn { height: 46px; padding: 0 20px; font-size: 14px; }
    .link-btn { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; color: var(--muted); padding: 10px 4px; }
    .link-btn:hover { color: var(--forest); }
    .link-btn[hidden] { display: none; }

    /* ---------- preguntas frecuentes ---------- */
    .faq-cols { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0 48px; }
    .faq-col { border-top: 1px solid var(--line-2); }
    .faq-col + .faq-col { border-top: 0; }
    .qa { border-bottom: 1px solid var(--line-2); }
    .qa button { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 24px 0; text-align: left; font: 600 17px/1.35 var(--sans); color: var(--ink); }
    .qa button:hover { color: var(--forest-2); }
    .pm { position: relative; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line-2); flex-shrink: 0; transition: background .3s, border-color .3s, transform .4s var(--ease); }
    .pm::before, .pm::after { content: ""; position: absolute; left: 50%; top: 50%; width: 12px; height: 1.8px; margin: -.9px 0 0 -6px; background: currentColor; border-radius: 2px; transition: transform .4s var(--ease); }
    .pm::after { transform: rotate(90deg); }
    .qa.open .pm { background: var(--forest); border-color: var(--forest); color: var(--ochre); transform: rotate(180deg); }
    .qa.open .pm::after { transform: rotate(0deg); }
    .ans { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .45s var(--ease); }
    .ans > div { overflow: hidden; }
    .ans p { margin: 0; padding: 0 54px 24px 0; color: var(--muted); font-size: 15.5px; }
    .qa.open .ans { grid-template-rows: 1fr; }

    /* ---------- pie de página ---------- */
    .foot { padding: clamp(72px, 9vw, 110px) 0 0; overflow: hidden; }
    .foot-cta { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 28px; padding-bottom: 56px; border-bottom: 1px solid var(--line-d); }
    .foot-cta .h2 { max-width: 13ch; }
    .foot-cta .cta { display: flex; flex-wrap: wrap; gap: 12px; }
    .foot-cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 36px 24px; padding: 48px 0; font-size: 14.5px; }
    .foot-cols h4 { margin: 0 0 14px; font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--ochre); }
    .foot-cols p, .foot-cols a, .foot-cols li { color: var(--muted-d); margin: 0; }
    .foot-cols ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
    .foot-cols a { display: inline-flex; gap: 8px; align-items: center; transition: color .2s; }
    .foot-cols a:hover { color: var(--bone); }
    .foot-brand { grid-column: 1 / -1; }
    .foot-cols > div:nth-child(2) { grid-column: 1 / -1; }
    .foot-brand .logo b { color: var(--bone); }
    .foot-brand .logo-mark { background: var(--ochre); color: var(--forest); }
    .foot-brand p { margin-top: 16px; max-width: 36ch; }
    .brand-xl { display: block; width: max-content; white-space: nowrap; text-align: center; font: 400 15vw/1 var(--serif); letter-spacing: -.035em; color: var(--bone); margin: 0 auto; padding: 8px 0 .06em;
           background: linear-gradient(180deg, var(--bone) 40%, rgba(246,245,240,.25)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .brand-xl em { -webkit-text-fill-color: var(--ochre); }
    .legal { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 20px; padding: 26px 0 calc(26px + env(safe-area-inset-bottom)); font-size: 12.5px; color: var(--muted-d); border-top: 1px solid var(--line-d); margin-top: 28px; }

    /* =========================================================
       ELEMENTOS DE VISTA PREVIA (no salen con &vista=final)
       ========================================================= */
    /* barra superior para el dueño */
    .owner { position: fixed; z-index: 75; top: 0; left: 0; right: 0; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
             padding: calc(8px + env(safe-area-inset-top)) 14px 8px; background: linear-gradient(90deg, var(--ochre), #EBC08A, var(--ochre)); background-size: 200% 100%;
             color: var(--forest-3); font: 700 13.5px/1.3 var(--sans); text-align: center; border-bottom: 1px solid rgba(17,42,32,.14); animation: shimmer 7s linear infinite; }
    @keyframes shimmer { to { background-position: -200% 0; } }
    .owner:hover .owner-go { background: var(--forest-3); }
    .owner-t { min-width: 0; text-wrap: balance; }
    .owner-go { display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; height: 28px; padding: 0 12px; border-radius: 999px; background: var(--forest); color: var(--bone); font-size: 12px; font-weight: 800; transition: background .2s; }
    .owner-go .ic { width: 14px; height: 14px; }

    /* ventana "así te llega un pedido" */
    .ov { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; padding: 16px; overflow-y: auto; background: rgba(11,29,22,.62);
          backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); opacity: 0; transition: opacity .35s var(--ease); }
    .ov.on { opacity: 1; }
    .ov-box { position: relative; margin: auto; width: min(420px, 100%); background: var(--paper); border-radius: var(--r-xl); padding: 26px 18px 18px; text-align: center;
              box-shadow: 0 40px 80px -30px rgba(0,0,0,.6); transform: translateY(24px) scale(.97); transition: transform .55s var(--ease); }
    .ov.on .ov-box { transform: none; }
    .ov-x { position: absolute; top: 12px; right: 12px; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--bone); color: var(--forest); }
    .ov-k { margin: 0; font-size: 11.5px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--ochre-2); }
    .ov-box h3 { font-size: clamp(28px, 6vw, 34px); margin: 8px 18px 8px; }
    .ov-s { margin: 0 auto 18px; font-size: 14px; color: var(--muted); max-width: 36ch; }
    .phone { position: relative; border-radius: 26px; overflow: hidden; background: #EFE7DD; border: 6px solid var(--forest-3); text-align: left; box-shadow: 0 20px 40px -24px rgba(0,0,0,.5); }
    .ph-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: var(--forest); color: var(--bone); }
    .ph-head > div { min-width: 0; }
    .ph-av { width: 36px; height: 36px; border-radius: 50%; background: var(--ochre); color: var(--forest-3); display: grid; place-items: center; font: 400 19px/1 var(--serif); flex-shrink: 0; }
    .ph-head b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ph-head small { font-size: 11.5px; color: var(--muted-d); }
    .ph-chat { padding: 16px 12px 18px; min-height: 320px; display: flex; flex-direction: column; gap: 10px;
               background-image: radial-gradient(rgba(17,42,32,.06) 1px, transparent 1px); background-size: 14px 14px; }
    .ph-typing { align-self: flex-start; display: none; gap: 4px; padding: 13px 14px; background: #fff; border-radius: 4px 16px 16px 16px; box-shadow: 0 1px 1px rgba(0,0,0,.08); }
    .ph-typing i { width: 7px; height: 7px; border-radius: 50%; background: #9AA59F; animation: dot 1s infinite; }
    .ph-typing i:nth-child(2) { animation-delay: .15s; } .ph-typing i:nth-child(3) { animation-delay: .3s; }
    @keyframes dot { 0%, 60%, 100% { transform: none; opacity: .5; } 30% { transform: translateY(-4px); opacity: 1; } }
    .phone.s2 .ph-typing { display: inline-flex; }
    .phone.s3 .ph-typing { display: none; }
    .ph-msg { align-self: flex-start; max-width: 94%; display: none; background: #fff; border-radius: 4px 16px 16px 16px; padding: 10px 12px 6px; font-size: 13.5px; line-height: 1.45;
              color: #111B21; box-shadow: 0 1px 1px rgba(0,0,0,.08); overflow-wrap: anywhere; }
    .ph-msg [data-txt] { white-space: pre-line; }
    .phone.s3 .ph-msg { display: block; animation: pop .45s var(--ease); }
    @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.96); } }
    .ph-from { font-size: 12px; font-weight: 800; color: var(--ochre-2); margin-bottom: 4px; }
    .ph-time { display: block; text-align: right; font-size: 10.5px; color: #667781; margin-top: 4px; }
    .ph-ready { align-self: center; display: none; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 16px; background: var(--good); color: #fff; font-size: 13px; font-weight: 700;
                text-align: center; box-shadow: 0 8px 20px -10px rgba(30,122,76,.8); }
    .ph-ready .ic { width: 16px; height: 16px; stroke-width: 2.6; }
    .phone.s4 .ph-ready { display: inline-flex; animation: pop .5s var(--ease); }
    .ph-notif { position: absolute; z-index: 3; top: 8px; left: 8px; right: 8px; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 16px;
                background: rgba(255,255,255,.97); box-shadow: 0 12px 28px -10px rgba(0,0,0,.4); transform: translateY(-150%); transition: transform .5s var(--ease); font-size: 12.5px; color: #111B21; }
    .phone.s1 .ph-notif { transform: none; }
    .phone.s3 .ph-notif { transform: translateY(-150%); }
    .ph-app { width: 30px; height: 30px; border-radius: 8px; background: #25D366; color: #fff; display: grid; place-items: center; flex-shrink: 0; }
    .ph-notif div { min-width: 0; flex: 1; }
    .ph-notif b { display: block; font-size: 12px; }
    .ph-notif span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ph-notif small { color: #667781; align-self: flex-start; }
    .ov-cta { display: grid; gap: 8px; margin-top: 16px; }
    .ov-cta .btn { width: 100%; white-space: normal; text-align: center; line-height: 1.2; }

    /* barra inferior fija "Activar" */
    .act { position: fixed; z-index: 70; left: 0; right: 0; bottom: 0; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: rgba(11,29,22,.94);
           border-top: 1px solid rgba(246,245,240,.12); backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%);
           box-shadow: 0 -18px 40px -20px rgba(0,0,0,.5); transform: translateY(110%); transition: transform .6s var(--ease); }
    .act.on { transform: none; }
    .act-in { width: min(1120px, 100%); margin: 0 auto; display: flex; align-items: center; gap: 8px; }
    .act-tag { display: none; align-items: center; gap: 10px; color: var(--muted-d); font-size: 13px; font-weight: 600; min-width: 0; margin-right: auto; }
    .act-tag span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .act-main { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 54px; padding: 8px 16px; border-radius: 16px;
                background: var(--ochre); color: var(--forest-3); box-shadow: 0 10px 24px -10px rgba(200,139,68,.8); transition: transform .25s var(--ease), background .25s; text-align: left; }
    .act-main:hover { background: #E1AC6C; }
    .act-main:active { transform: scale(.98); }
    .act-main .wa-svg { width: 24px; height: 24px; }
    .act-main span { min-width: 0; }
    .act-main b { display: block; font: 800 15px/1.15 var(--sans); }
    .act-main small { display: block; font-size: 12px; font-weight: 700; opacity: .78; margin-top: 2px; }
    .act-card { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 54px; padding: 6px 12px; border-radius: 16px;
                border: 1px solid var(--line-d); color: var(--bone); background: rgba(246,245,240,.06); font-size: 11.5px; font-weight: 800; text-align: center; transition: background .2s; }
    .act-card:hover { background: rgba(246,245,240,.14); }
    .act-card .ic { width: 20px; height: 20px; }

    /* ---------- aparición al hacer scroll ---------- */
    .js .rv { opacity: 0; transform: translateY(22px); transition: opacity .9s var(--ease), transform .9s var(--ease); }
    .js .rv.in { opacity: 1; transform: none; }
    .js .tile.rv { transition: opacity .45s var(--ease), transform .5s var(--ease); }
    .js .rv.d1 { transition-delay: .08s; } .js .rv.d2 { transition-delay: .16s; } .js .rv.d3 { transition-delay: .24s; }

    /* ---------- tamaños mayores ---------- */
    @media (min-width: 560px) {
      .call { width: auto; padding: 0 18px 0 14px; }
      .call .txt { display: inline; }
      .svc { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .foot-cols { grid-template-columns: minmax(0, 1.6fr) repeat(3, minmax(0, 1fr)); }
      .foot-brand, .foot-cols > div:nth-child(2) { grid-column: auto; }
    }
    @media (min-width: 760px) {
      .bento { grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: 220px; gap: 14px; }
      .faq-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .faq-col + .faq-col { border-top: 1px solid var(--line-2); }
      .ba { aspect-ratio: 16 / 11; }
      .rev-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .audit-grid { grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); }
      .vs { margin: 0 -22px; }
      .act-tag { display: flex; }

  <script>
  (async () => {
    "use strict";
    document.documentElement.classList.add("js");

    /* =====================================================
       1) CONFIGURACIÓN
       Link de ejemplo:
       ?giro=roofing&cliente=Nombre&tel=3055550123&rating=4.9&reviews=84&ciudad=Miami&email=info@x.com
        &competidor=Otro+Negocio&crating=4.8&creviews=210&lang=es|en|pt&vista=final
       Fotos:   &portada=URL &antes=URL &despues=URL &fotos=URL1,URL2,URL3
       Reseñas: &r1=Nombre|Texto|5 &r2=... &r3=...
       Archivo del cliente: &datos=clientes/mi-cliente.json  (o &id=mi-cliente → clientes/mi-cliente.json)
       Prioridad: parámetros del link > archivo JSON > textos de respaldo del giro.
       ===================================================== */
    const CONFIG = {
      telDemo: "13055550123",          // si no llega &tel=
      miWhatsapp: "13059269442",       // botón "Activar este sitio web hoy"
      radarTopic: "vc-radar-8h3kq7z2mw5x", // igual que RADAR_TOPIC en servidor-whatsapp/server.js
      giro: "landscaping"              // giro por defecto
    };
    // Pega aquí tu link de pago de Stripe (https://buy.stripe.com/...). Vacío = el botón de tarjeta no aparece.
    const STRIPE_URL = "";

    const P = new URLSearchParams(location.search);
    const clean = (v, n) => String(v ?? "").replace(/[<>"]/g, "").trim().slice(0, n);

    // Archivo JSON local del cliente (solo rutas relativas del mismo sitio)
    const rutaJSON = (() => {
      const d = P.get("datos") || "", id = P.get("id") || "";
      const r = d || (id ? `clientes/${id}.json` : "");
      return /^[\w-]+(\/[\w-]+)*\.json$/i.test(r) ? r : "";
    })();
    let J = {};
    if (rutaJSON) {
      try {
        const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 3000);
        const r = await fetch(rutaJSON, { signal: ctl.signal, cache: "no-cache" });
        clearTimeout(tm);
        if (r.ok) { const j = await r.json(); if (j && typeof j === "object" && !Array.isArray(j)) J = j; }
      } catch (e) { /* sin archivo: se usan los textos de respaldo */ }
    }
    const val = (k, alt) => {
      const v = P.get(k);
      if (v != null && v.trim() !== "") return v;
      for (const key of [k, alt]) if (key && J[key] != null && typeof J[key] !== "object") return String(J[key]);
      return "";
    };

    /* ===================== 2) GIRO ===================== */

    };

    /* ===================== 7) PINTAR ===================== */
    const $ = s => document.querySelector(s);
    const $$ = s => [...document.querySelectorAll(s)];
    const LI = () => ({ en: 0, es: 1, pt: 2 })[LANG];
    const L = a => Array.isArray(a) ? (a[LI()] ?? a[0]) : a;
    const tx = k => G[k] != null ? L(G[k]) : T[LANG][k];   // texto del giro si existe, si no el general
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const telBonito = t => t.length === 11 && t[0] === "1" ? `(${t.slice(1, 4)}) ${t.slice(4, 7)}-${t.slice(7)}` : "+" + t;
    const money = n => "$" + Math.round(n).toLocaleString("en-US");
    const fmt = n => (+n).toLocaleString("en-US");
    const U = (id, w) => `https://images.unsplash.com/photo-${id}?auto=format&fit=crop&w=${w}&q=68`;
    const estrellas = (n = 5) => Array.from({ length: 5 }, (_, i) => ic("star", i < n ? "" : "off")).join("");
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

    $$("[data-ic]").forEach(el => { el.outerHTML = ic(el.dataset.ic, el.className); });
    $$("[data-wa-path]").forEach(p => p.setAttribute("d", WA_D));
    $$("[data-logo]").forEach(el => el.innerHTML = ic(G.ic));
    $$("[data-name]").forEach(el => el.textContent = NEGOCIO);
    $$("[data-tel]").forEach(a => a.href = "tel:+" + TEL);
    $$("[data-tel-txt]").forEach(el => el.textContent = telBonito(TEL));
    if (EMAIL) {
      $$("[data-mail]").forEach(a => a.href = "mailto:" + EMAIL);
      $$("[data-mail-txt]").forEach(el => el.textContent = EMAIL);
    } else {
      $$("[data-mail]").forEach(a => a.closest("li").hidden = true);
      $("#sendMail").hidden = true; $("#send").classList.add("two");
    }
    $$("[data-rating]").forEach(el => el.textContent = RATING);
    $$("[data-stars]").forEach(el => el.innerHTML = estrellas(5));
    $$("[data-gmaps]").forEach(a => a.href = "https://www.google.com/maps/search/" + encodeURIComponent(NEGOCIO + (CIUDAD ? " " + CIUDAD : "")));
    $("#yr").textContent = new Date().getFullYear();

    // Portada y antes/después (fotos del cliente si llegan; si no, las del giro)
    const heroImg = $("#heroImg");
    heroImg.src = imgOK(val("portada")) || (FOTOS[0] && FOTOS[0].u) || U(G.img[0], 1100);
    $("#baBefore").src = imgOK(val("antes")) || U(G.img[1], 1300);
    $("#baAfter").src = imgOK(val("despues")) || U(G.img[2], 1300);

    // Cifras de la portada
    $("#metrics").innerHTML = G.m.map((m, i) => `<div><strong data-count="${m[0]}" data-m="${i}">${fmt(m[0])}</strong><span data-ml="${i}"></span></div>`).join("");
    const sufijo = el => L(G.m[+el.dataset.m][1]);

    /* ---------- galería ---------- */
    const PROPIAS = FOTOS.length > 0;
    const GAL = PROPIAS ? FOTOS.map(f => ({ f: "own", src: f.u, t: f.t })) : G.gal.map(([f, id, t]) => ({ f, src: U(id, 900), t }));
    $("#bento").innerHTML = GAL.map((g, i) => `
      <figure class="tile rv" data-f="${g.f}">
        <img src="${esc(g.src)}" alt="" loading="lazy" decoding="async" />
        <span class="tag"><i></i><span data-tag="${g.f}"></span></span>
        <figcaption${g.t ? "" : " hidden"}><span data-cap="${i}"></span><span class="go">${ic("upr")}</span></figcaption>
      </figure>`).join("");
    const tiles = $$(".tile");
    // Patrón bento según cuántas fotos se ven, para que la cuadrícula siempre quede llena
    const PAT = { 1: ["big"], 2: ["big", "big"], 3: ["big", "tall", "tall"], 4: ["big", "tall", "", ""], 5: ["big", "", "", "", ""], 6: ["big", "tall", "", "", "wide", "wide"] };
    const acomodar = () => {
      const vis = tiles.filter(t => !t.hidden);
      tiles.forEach(t => t.classList.remove("big", "wide", "tall"));
      for (let i = 0; i < vis.length; i += 6) { const n = Math.min(6, vis.length - i); PAT[n].forEach((c, j) => { if (c) vis[i + j].classList.add(c); }); }
    };
    acomodar();
    const tabsBox = $("#tabs");
    if (PROPIAS) tabsBox.hidden = true;
    else {
      tabsBox.innerHTML = ["all", "a", "b", "c"].map(f => `<button class="tab" role="tab" data-f="${f}" aria-selected="${f === "all"}"><span data-tab="${f}"></span><small>${f === "all" ? GAL.length : GAL.filter(g => g.f === f).length}</small></button>`).join("");
      $$(".tab").forEach(tab => tab.addEventListener("click", () => {
        const f = tab.dataset.f;
        if (tab.getAttribute("aria-selected") === "true") return;
        $$(".tab").forEach(t => t.setAttribute("aria-selected", t === tab));
        tiles.forEach(t => t.classList.add("out"));
        setTimeout(() => {
          tiles.forEach(t => { t.hidden = !(f === "all" || t.dataset.f === f); t.classList.add("in"); });
          acomodar();
          requestAnimationFrame(() => requestAnimationFrame(() => tiles.forEach(t => t.classList.remove("out"))));
        }, 260);
      }));
    }

    /* ---------- reseñas (reales si llegan; las de ejemplo solo en la vista previa) ---------- */
    const REALES = RES.length > 0;
    const LISTA_RES = REALES ? RES : G.rev.map(([n, t]) => ({ n, t, e: 5 }));
    if (!REALES && !PREVIEW) $("#reviews").hidden = true;
    $("#revNote").hidden = REALES;
    const pintarResenas = () => {
      $("#revGrid").innerHTML = LISTA_RES.map((r, i) => `
        <figure class="rev rv${i ? " d" + i : ""}">
          ${ic("quote", "q")}
          <span class="stars">${estrellas(r.e)}</span>
          <blockquote>“${esc(L(r.t))}”</blockquote>
          <figcaption><span class="av">${esc(r.n.charAt(0).toUpperCase())}</span><span><b>${esc(r.n)}</b><small>${esc(T[LANG].revSrc)}</small></span></figcaption>
        </figure>`).join("");
      if (window.__io) $$("#revGrid .rv").forEach(el => window.__io.observe(el)); else $$("#revGrid .rv").forEach(el => el.classList.add("in"));
    };

    /* ---------- preguntas frecuentes en dos columnas ---------- */
    const mitad = Math.ceil(FAQ.length / 2);
    $("#faqCols").innerHTML = [FAQ.slice(0, mitad), FAQ.slice(mitad)].map((col, c) => `<div class="faq-col">${col.map((q, j) => {
      const i = c * mitad + j;
      return `<div class="qa rv"><button type="button" aria-expanded="false" aria-controls="ans${i}"><span data-q="${i}"></span><span class="pm" aria-hidden="true"></span></button>
        <div class="ans" id="ans${i}" role="region"><div><p data-a="${i}"></p></div></div></div>`; }).join("")}</div>`).join("");
    $$(".qa button").forEach(b => b.addEventListener("click", () => {
      const qa = b.parentElement, open = !qa.classList.contains("open");
      $$(".qa.open").forEach(o => { if (o !== qa) { o.classList.remove("open"); o.querySelector("button").setAttribute("aria-expanded", "false"); } });
      qa.classList.toggle("open", open); b.setAttribute("aria-expanded", open);
    }));

    /* ---------- cotizador ---------- */
    const Q = { step: 1, svc: null, sqft: 1, urg: "soon" };
    const svcBox = $("#svc"), urgBox = $("#urg"), range = $("#sqft");
    const opcion = (o, grupo) => `<button type="button" class="opt" role="radio" aria-checked="false" data-${grupo}="${o.id}">
        <span class="oi">${ic(o.ic)}</span><span class="tick">${ic("check")}</span><b data-n></b><small data-s></small></button>`;
    svcBox.innerHTML = SERVICIOS.map(s => opcion(s, "svc")).join("");
    urgBox.innerHTML = URGENCIA.map(u => opcion(u, "urg")).join("");
    const svcSel = () => SERVICIOS.find(s => s.id === Q.svc);
    const redondear = n => { const p = n < 500 ? 5 : n < 2000 ? 25 : n < 10000 ? 100 : 500; return Math.round(n / p) * p; };
    const calc = (s, q, k) => [redondear(Math.max(s.piso, s.low * q * k)), redondear(Math.max(s.piso * 1.4, s.high * q * k))];
    const calcular = () => { const s = svcSel(); return s ? calc(s, Q.sqft, URGENCIA.find(u => u.id === Q.urg).k) : null; };
    const rangoTxt = r => r ? `${money(r[0])} – ${money(r[1])}` : "—";
    const unidad = (s, n) => L(UNITS[s.u].u)[+n === 1 ? 0 : 1];
    const qtyTxt = (s, n) => `${fmt(n)} ${unidad(s, n)}`;
    const pintarRange = () => {
      const s = svcSel();
      const p = (range.value - range.min) / (range.max - range.min || 1) * 100;
      range.style.setProperty("--p", p + "%");
      $("#sqftNum").textContent = fmt(+range.value);
      if (s) $("#sqftU").textContent = unidad(s, +range.value);
      $("#liveVal").textContent = rangoTxt(calcular());
      $$(".chip").forEach(c => c.classList.toggle("on", +c.dataset.v === +range.value));
    };
    const prepararPaso2 = () => {
      const s = svcSel(), t = T[LANG];
      range.min = s.min; range.max = s.max; range.step = s.step;
      if (Q.sqft < s.min || Q.sqft > s.max || Q._svcPrev !== s.id) Q.sqft = s.def;
      Q._svcPrev = s.id; range.value = Q.sqft;
      range.setAttribute("aria-label", L(UNITS[s.u].lbl));
      $("#qtyLbl").textContent = L(UNITS[s.u].lbl);
      $("#rMin").textContent = qtyTxt(s, s.min); $("#rMax").textContent = qtyTxt(s, s.max);
      const pre = [...new Set([s.min + (s.max - s.min) * .12, s.def, s.min + (s.max - s.min) * .55]
        .map(v => Math.min(s.max, Math.max(s.min, Math.round(v / s.step) * s.step))))].sort((a, b) => a - b);
      $("#presets").innerHTML = pre.map((v, i) => `<button type="button" class="chip" data-v="${v}">${pre.length === 3 ? t.presets[i] + " · " : ""}${esc(qtyTxt(s, v))}</button>`).join("");
      $$(".chip").forEach(c => c.addEventListener("click", () => { range.value = Q.sqft = +c.dataset.v; pintarRange(); }));
      $("#svcName").textContent = L(s.n);
      pintarRange();
    };
    let animPrecio;
    const pintarResultado = () => {
      const r = calcular(), s = svcSel(), u = URGENCIA.find(x => x.id === Q.urg), t = T[LANG];
      $("#summary").innerHTML = `<li><span>${t.sumSvc}</span><b>${esc(L(s.n))}</b></li><li><span>${esc(L(UNITS[s.u].k))}</span><b>${esc(qtyTxt(s, Q.sqft))}</b></li><li><span>${t.sumTime}</span><b>${esc(L(u.n))}</b></li>`;
      cancelAnimationFrame(animPrecio); const t0 = performance.now(), el = $("#price");
      const paso = now => { const k = Math.min(1, (now - t0) / 900), e = 1 - Math.pow(1 - k, 3);
        el.innerHTML = `${money(redondear(r[0] * e))}<span>–</span>${money(redondear(r[1] * e))}`; if (k < 1) animPrecio = requestAnimationFrame(paso); };
      animPrecio = requestAnimationFrame(paso);
      actualizarEnvio();
    };
    const mensaje = (s, q, u, name) => T[LANG].msg({ svc: L(s.n), k: L(UNITS[s.u].k), area: qtyTxt(s, q), time: L(u.n), range: rangoTxt(calc(s, q, u.k)), name, ask: tx("ask") });
    const actualizarEnvio = () => {
      const s = svcSel(); if (!s) return;
      const u = URGENCIA.find(x => x.id === Q.urg), t = T[LANG];
      const txt = mensaje(s, Q.sqft, u, $("#qName").value.trim().slice(0, 60));
      $("#sendWa").href = `https://wa.me/${TEL}?text=${encodeURIComponent(txt)}`;
      $("#sendSms").href = `sms:+${TEL}?&body=${encodeURIComponent(txt)}`;
      if (EMAIL) $("#sendMail").href = `mailto:${EMAIL}?subject=${encodeURIComponent(t.mailSubj)}&body=${encodeURIComponent(txt)}`;
    };
    const irA = n => {
      Q.step = n;
      $$(".pane").forEach(p => p.classList.toggle("on", +p.dataset.pane === n));
      $$(".step-dot").forEach((d, i) => { d.classList.toggle("on", i + 1 === n); d.classList.toggle("done", i + 1 < n); });
      $("#qBar").style.width = (n / 3 * 100) + "%";
      $("#qBack").hidden = n === 1; $("#qHint").hidden = n !== 1;
      $("#qNext").hidden = n === 3; $("#qReset").hidden = n !== 3;
      pintarBotones();
      if (n === 2) prepararPaso2();
      if (n === 3) pintarResultado();
      const card = $("#q").getBoundingClientRect();
      if (card.top < 70) window.scrollBy({ top: card.top - 96, behavior: "smooth" });
    };
    const pintarBotones = () => {
      const t = T[LANG];
      $("#qNext").disabled = Q.step === 1 && !Q.svc;
      $("#qNext").querySelector("span").textContent = Q.step === 2 ? t.see : t.next;
      $("#qHint").textContent = t.hint1;
    };
    svcBox.addEventListener("click", e => {
      const b = e.target.closest(".opt"); if (!b) return;
      Q.svc = b.dataset.svc;
      $$("#svc .opt").forEach(o => o.setAttribute("aria-checked", o === b));
      pintarBotones();
      setTimeout(() => { if (Q.step === 1) irA(2); }, 380);   // avanza solo, estilo Lovable
    });
    urgBox.addEventListener("click", e => {
      const b = e.target.closest(".opt"); if (!b) return;
      Q.urg = b.dataset.urg;
      $$("#urg .opt").forEach(o => o.setAttribute("aria-checked", o === b));
      pintarRange();
    });
    range.addEventListener("input", () => { Q.sqft = +range.value; pintarRange(); });
    $("#qNext").addEventListener("click", () => irA(Q.step + 1));
    $("#qBack").addEventListener("click", () => irA(Q.step - 1));
    $("#qReset").addEventListener("click", () => { Q.svc = null; $$("#svc .opt").forEach(o => o.setAttribute("aria-checked", "false")); irA(1); });
    $("#qName").addEventListener("input", actualizarEnvio);
    [svcBox, urgBox].forEach(g => g.addEventListener("keydown", e => {
      const items = [...g.querySelectorAll(".opt")], i = items.indexOf(document.activeElement);
      if (i < 0 || !["ArrowRight", "ArrowDown", "ArrowLeft", "ArrowUp"].includes(e.key)) return;
      e.preventDefault(); items[(i + (/Right|Down/.test(e.key) ? 1 : items.length - 1)) % items.length].focus();
    }));
    $(`#urg [data-urg="${Q.urg}"]`).setAttribute("aria-checked", "true");

    /* ---------- antes y después (táctil + mouse + teclado) ---------- */
    const ba = $("#ba"), knob = ba.querySelector(".knob");
    let pos = 50, arrastrando = false;
    const ponerPos = v => { pos = Math.max(0, Math.min(100, v)); ba.style.setProperty("--pos", pos + "%"); knob.setAttribute("aria-valuenow", Math.round(pos)); };
    const desdeX = x => { const r = ba.getBoundingClientRect(); ponerPos((x - r.left) / r.width * 100); };
    ba.addEventListener("pointerdown", e => { arrastrando = true; ba.classList.add("drag", "used"); ba.setPointerCapture(e.pointerId); desdeX(e.clientX); });
    ba.addEventListener("pointermove", e => { if (arrastrando) desdeX(e.clientX); });
    ["pointerup", "pointercancel", "lostpointercapture"].forEach(ev => ba.addEventListener(ev, () => { arrastrando = false; ba.classList.remove("drag"); }));
    knob.addEventListener("keydown", e => {
      const d = { ArrowLeft: -5, ArrowDown: -5, ArrowRight: 5, ArrowUp: 5, Home: -100, End: 100 }[e.key];
      if (d !== undefined) { e.preventDefault(); ba.classList.add("used"); ponerPos(pos + d); }
    });

    /* ---------- vista previa: ficha vs competencia ---------- */
    if (PREVIEW) {
      $("#auditWrap").hidden = false;
      if (C_RATING) {
        $("#compRate").hidden = false;
        $("#compRating").textContent = C_RATING;
        $("#compRate [data-stars]").innerHTML = estrellas(Math.round(+C_RATING));
      }
    }

    /* ---------- vista previa: ejemplo de pedido recibido ---------- */
    const ov = $("#ov"), phone = $("#phone");
    let ovTimers = [], ovPrev = null, ovHide;
    const pintarDemo = () => {
      const t = T[LANG], s = SERVICIOS[0], u = URGENCIA[1], r = rangoTxt(calc(s, s.def, u.k));
      $("#phAv").textContent = NEGOCIO.charAt(0).toUpperCase();
      $("#phNotif").textContent = t.ovNotif(r);
      $("#phFrom").textContent = `${t.sample} · ${t.ovFrom}`;
      $("#phTxt").textContent = mensaje(s, s.def, u, t.sample);
      $("#phReady").textContent = t.ovReady(r);
    };
    const abrirDemo = () => {
      ovPrev = document.activeElement;
      clearTimeout(ovHide);
      pintarDemo();
      ov.hidden = false; phone.className = "phone";
      document.body.style.overflow = "hidden";
      requestAnimationFrame(() => requestAnimationFrame(() => ov.classList.add("on")));
      ovTimers.forEach(clearTimeout);
      ovTimers = [[450, "s1"], [1300, "s2"], [2800, "s3"], [3600, "s4"]].map(([ms, c]) => setTimeout(() => phone.classList.add(c), reduce ? 0 : ms));
      setTimeout(() => $("#ovX").focus(), 60);
    };
    const cerrarDemo = () => {
      if (ov.hidden) return;
      ov.classList.remove("on"); ovTimers.forEach(clearTimeout);
      document.body.style.overflow = "";
      ovHide = setTimeout(() => { ov.hidden = true; }, 350);
      if (ovPrev && ovPrev.focus) ovPrev.focus();
    };
    $("#owner").addEventListener("click", abrirDemo);
    $("#ovX").addEventListener("click", cerrarDemo);
    $("#ovClose").addEventListener("click", cerrarDemo);
    ov.addEventListener("click", e => { if (e.target === ov) cerrarDemo(); });
    addEventListener("keydown", e => { if (e.key === "Escape") cerrarDemo(); });

    /* ---------- idioma (cambia todo sin recargar) ---------- */
    const fitBig = () => {
      const el = $("#big"); el.style.fontSize = "100px";
      const w = el.scrollWidth, max = document.documentElement.clientWidth * .96;
      if (w) el.style.fontSize = Math.min(100 * max / w, 420) + "px";
    };
    const medir = () => {
      const r = document.documentElement.style;
      r.setProperty("--obh", PREVIEW ? $("#owner").offsetHeight + "px" : "0px");
      r.setProperty("--abh", PREVIEW ? $("#act").offsetHeight + "px" : "0px");
    };
    const aplicarIdioma = () => {
      const t = T[LANG];
      document.documentElement.lang = LANG;
      $("#lang").dataset.i = LI();
      $$("#lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === LANG));
      $$("[data-i18n]").forEach(el => { const v = tx(el.dataset.i18n); if (typeof v === "string") el.textContent = v; });
      $$("[data-i18n-html]").forEach(el => el.innerHTML = tx(el.dataset.i18nHtml));
      $$("[data-i18n-ph]").forEach(el => el.placeholder = tx(el.dataset.i18nPh));
      $$("[data-i18n-aria]").forEach(el => el.setAttribute("aria-label", tx(el.dataset.i18nAria)));
      $$("[data-reviews-txt]").forEach(el => el.textContent = "· " + t.reviewsTxt(fmt(RESENAS)));
      $("[data-lead]").textContent = L(G.lead).replace("{n}", NEGOCIO).replace("{z}", t.zona(CIUDAD));
      $("[data-city-txt]").textContent = t.city(CIUDAD);
      $("[data-city-foot]").textContent = t.city(CIUDAD);
      $$("[data-ml]").forEach(el => el.textContent = L(G.m[+el.dataset.ml][2]));
      $$("[data-count]").forEach(el => { if (!el.dataset.anim) el.innerHTML = fmt(el.dataset.count) + sufijo(el); });
      $$("[data-tab]").forEach(el => el.textContent = el.dataset.tab === "all" ? t.fAll : L(G.tabs[el.dataset.tab]));
      $$("[data-tag]").forEach(el => el.textContent = el.dataset.tag === "own" ? t.ourWork : L(G.tabs[el.dataset.tag]));
      $$("[data-cap]").forEach(el => el.textContent = L(GAL[+el.dataset.cap].t) || "");
      $$("[data-q]").forEach(el => el.textContent = L(FAQ[+el.dataset.q][0]));
      $$("[data-a]").forEach(el => el.textContent = L(FAQ[+el.dataset.a][1]));
      $$("#svc .opt").forEach((o, i) => { o.querySelector("[data-n]").textContent = L(SERVICIOS[i].n); o.querySelector("[data-s]").textContent = L(SERVICIOS[i].s); });
      $$("#urg .opt").forEach((o, i) => { o.querySelector("[data-n]").textContent = L(URGENCIA[i].n); o.querySelector("[data-s]").textContent = L(URGENCIA[i].s); });
      $$("[data-wa]").forEach(a => a.href = `https://wa.me/${TEL}?text=${encodeURIComponent(t.waHello)}`);
      heroImg.alt = `${NEGOCIO} — ${L(G.title)}`;
      pintarResenas();
      // vista previa
      $("[data-owner-txt]").textContent = t.ownerBar(NEGOCIO);
      $("#audT").innerHTML = t.audTitle(esc(NEGOCIO));
      $("#audRev").textContent = t.audRev(fmt(RESENAS));
      $("#compName").textContent = COMP || t.audComp(L(G.plural), CIUDAD);
      $("#compRev").textContent = C_REV ? t.audRev(fmt(C_REV)) : "";
      $("[data-act-tag]").textContent = t.actTag(NEGOCIO);
      $$("[data-activar]").forEach(a => a.href = `https://wa.me/${CONFIG.miWhatsapp}?text=${encodeURIComponent(t.actMsg(NEGOCIO))}`);
      if (!ov.hidden) pintarDemo();
      document.title = `${NEGOCIO} · ${L(G.title)}`;
      pintarBotones();
      if (Q.step === 2) prepararPaso2();
      if (Q.step === 3) pintarResultado();
      fitBig(); medir();
    };
    $$("#lang button").forEach(b => b.addEventListener("click", () => { if (b.dataset.l !== LANG) { LANG = b.dataset.l; aplicarIdioma(); } }));

    /* ---------- vista previa: barra superior y barra inferior ---------- */
    if (PREVIEW) {
      document.body.classList.add("pre");
      $("#owner").hidden = false;
      const act = $("#act"); act.hidden = false;
      if (/^https:\/\/\S+$/i.test(STRIPE_URL)) { const c = $("#actCard"); c.href = STRIPE_URL; c.hidden = false; }
      setTimeout(() => act.classList.add("on"), reduce ? 0 : 1200);
    }

    aplicarIdioma();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { fitBig(); medir(); });
    let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { fitBig(); medir(); }, 120); });

    /* ---------- barra al hacer scroll ---------- */
    const nav = $("#nav");
    addEventListener("scroll", () => nav.classList.toggle("scrolled", scrollY > 20), { passive: true });

    /* ---------- aparición, contadores y pista del slider ---------- */
    const contar = el => {
      el.dataset.anim = 1; const fin = +el.dataset.count, t0 = performance.now();
      const paso = now => { const k = Math.min(1, (now - t0) / 1400), e = 1 - Math.pow(1 - k, 3);
        el.innerHTML = fmt(Math.round(fin * e)) + sufijo(el); if (k < 1) requestAnimationFrame(paso); else delete el.dataset.anim; };
      requestAnimationFrame(paso);
    };
    const pista = () => { if (ba.classList.contains("used") || reduce) return;
      const t0 = performance.now();
      const paso = now => { if (ba.classList.contains("used")) return; const k = Math.min(1, (now - t0) / 1600);
        ponerPos(50 + Math.sin(k * Math.PI * 2) * 14 * (1 - k)); if (k < 1) requestAnimationFrame(paso); };
      requestAnimationFrame(paso); };
    if ("IntersectionObserver" in window) {
      const io = window.__io = new IntersectionObserver(es => es.forEach(e => {
        if (!e.isIntersecting) return;
        e.target.classList.add("in");
        if (e.target.classList.contains("metrics")) $$("[data-count]").forEach(contar);
        if (e.target === ba) setTimeout(pista, 700);
        io.unobserve(e.target);
      }), { threshold: .15, rootMargin: "0px 0px -40px 0px" });
      $$(".rv, .metrics").forEach(el => io.observe(el));
    } else $$(".rv").forEach(el => el.classList.add("in"));

    /* ---------- radar: avisa a tu panel que el prospecto abrió su web o tocó la barra del dueño (una vez por visita cada uno) ---------- */
    // Tus propios clics nunca cuentan: un link con &notrack=1 (o &admin=1) marca este navegador como tuyo para siempre
    const NOTRACK = P.get("notrack") === "1" || P.get("admin") === "1";
    if (NOTRACK) { try { localStorage.setItem("es_admin", "1"); } catch (x) {} }
    const esAdmin = () => { if (NOTRACK) return true; try { return localStorage.getItem("es_admin") === "1"; } catch (x) { return false; } };
    const RADAR_ON = CLIENTE && PREVIEW && /^https?:$/.test(location.protocol) && !/^(localhost|127\.|192\.168\.|10\.)/.test(location.hostname);
    const ID = clean(P.get("id"), 80);
    const avisarRadar = e => {
      if (!RADAR_ON || esAdmin()) return;   // se revisa justo antes de cada envío a ntfy
      let nueva = true;
      try { const k = "vc_radar_" + e + location.search; nueva = !sessionStorage.getItem(k); sessionStorage.setItem(k, "1"); } catch (x) {}
      if (nueva) fetch(`https://ntfy.sh/${CONFIG.radarTopic}`, { method: "POST", body: JSON.stringify({ t: TEL_DUENO, c: NEGOCIO, g: GIRO, id: ID, e }), keepalive: true }).catch(() => {});
    };
    avisarRadar("abrio");
    $("#owner").addEventListener("click", () => avisarRadar("dueno"));
  })();
  </script>
</body>
</html>
