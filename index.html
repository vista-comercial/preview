<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#081226" />
  <title>Página web profesional</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111827'/%3E%3Cpath d='M9 17l5 5 9-11' stroke='%23fff' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500;1,600;1,700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    window.tailwind = window.tailwind || {};
    (() => {
    const c = n => `rgb(var(--${n}) / <alpha-value>)`;
    tailwind.config = {
      theme: { extend: {
        fontFamily: { sans: ['"Plus Jakarta Sans"', "system-ui", "sans-serif"], display: ["var(--ft)"] },
        colors: { page: c("base"), alt: c("alt"), card: c("card"), line: c("line"), ink: c("ink"), muted: c("muted"),
                  acc: c("acc"), acc2: c("acc2"), onacc: c("onacc"), hero: c("hero"), tx: c("tx") }
      } }
    };
    })();
  </script>
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <style>
    /* Los colores y la tipografía se llenan según el giro (?giro=). Por defecto: servicios profesionales / contratistas. */
    :root { --base: 255 255 255; --alt: 244 246 250; --card: 255 255 255; --line: 226 232 240; --ink: 11 22 48; --muted: 91 103 130;
            --acc: 255 183 3; --acc2: 251 133 0; --onacc: 11 22 48; --hero: 8 18 38; --tx: 180 83 9; --shadow: 15 23 42;
            --accLight: #ffd97a; --glass: rgba(255,255,255,.72); --glass-line: rgba(226,232,240,.9);
            --ft: "Outfit", system-ui, sans-serif; }
    html { scroll-behavior: smooth; scroll-padding-top: 126px; }
    body { font-family: "Plus Jakarta Sans", system-ui, sans-serif; background: rgb(var(--base)); color: rgb(var(--ink));
           -webkit-font-smoothing: antialiased; overflow-x: hidden; opacity: 0; transition: opacity .5s; animation: mostrar 0s 2.5s forwards; }
    body.listo { opacity: 1; }
    @keyframes mostrar { to { opacity: 1; } }

    /* ---------- íconos SVG (Lucide, trazo fino) ---------- */
    svg.lucide { width: 1.15em; height: 1.15em; flex-shrink: 0; stroke-width: 1.6; }
    .estrella { color: #fbbf24; fill: #fbbf24; }
    .wa-svg { width: 1.3em; height: 1.3em; fill: currentColor; flex-shrink: 0; }

    /* ---------- tipografía editorial ---------- */
    .font-display, .h2, .h1 { font-family: var(--ft); }
    .h2 { font-size: clamp(32px, 5.6vw, 56px); }
    .tech .h1 { font-weight: 900; letter-spacing: -.045em; line-height: .95; }
    .tech .h2 { font-weight: 800; letter-spacing: -.035em; line-height: 1.02;
                background: linear-gradient(180deg, rgb(var(--ink)) 35%, rgb(var(--ink) / .62)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .tech.oscuro .h2 { background-image: linear-gradient(180deg, #ffffff 20%, #b4b8c2 70%, #8b909c); }
    .serif .h1 { font-weight: 700; letter-spacing: -.02em; line-height: 1.02; }
    .serif .h2 { font-weight: 600; letter-spacing: -.015em; line-height: 1.08; }
    .kw { background: linear-gradient(100deg, rgb(var(--tx)), rgb(var(--acc)) 55%, rgb(var(--acc2))); -webkit-background-clip: text; background-clip: text; color: transparent;
          -webkit-text-fill-color: transparent; padding-right: .06em; }
    .serif .kw { font-style: italic; font-weight: 500; }
    .h1 .kw, .claro .kw { background-image: linear-gradient(100deg, var(--accLight), rgb(var(--acc)) 55%, rgb(var(--acc2))); }
    .tech .h1 .kw { background-image: linear-gradient(180deg, #fff 0%, var(--accLight) 35%, rgb(var(--acc)) 75%, rgb(var(--acc2))); }

    /* ---------- color y vidrio ---------- */
    .grad { background-image: linear-gradient(135deg, rgb(var(--acc)), rgb(var(--acc2))); }
    .num { background: linear-gradient(135deg, rgb(var(--tx)), rgb(var(--acc2))); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .glass { background: var(--glass); border: 1px solid var(--glass-line); backdrop-filter: blur(18px) saturate(160%); -webkit-backdrop-filter: blur(18px) saturate(160%); }
    .glass-strong { background: rgb(var(--card) / .92); border: 1px solid var(--glass-line); backdrop-filter: blur(22px) saturate(170%); -webkit-backdrop-filter: blur(22px) saturate(170%); }
    .glass-dark { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); color: #fff;
                  backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%); }
    .shadow-soft { box-shadow: 0 1px 2px rgb(var(--shadow) / .05), 0 12px 32px -14px rgb(var(--shadow) / .2); }
    .shadow-deep { box-shadow: 0 2px 4px rgb(var(--shadow) / .06), 0 24px 48px -20px rgb(var(--shadow) / .35), 0 50px 100px -40px rgb(var(--shadow) / .35); }
    .ico-box { background: rgb(var(--acc) / .1); color: rgb(var(--tx)); box-shadow: inset 0 0 0 1px rgb(var(--acc) / .25); }
    .ico-box-d { background: rgba(255,255,255,.07); color: var(--accLight); box-shadow: inset 0 0 0 1px rgba(255,255,255,.15); }
    .blob { position: absolute; width: 440px; height: 440px; border-radius: 50%; filter: blur(100px); opacity: .16; background: rgb(var(--acc)); pointer-events: none; }

    /* ---------- header único (cintillo + navbar) ---------- */
    .hdr { background: rgb(var(--hero) / .8); color: #fff; border-bottom: 1px solid rgba(255,255,255,.08);
           backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); transition: box-shadow .3s; }
    html.solid .hdr { box-shadow: 0 18px 40px -20px rgba(0,0,0,.55); }
    .cinta { border-bottom: 1px solid rgba(255,255,255,.07); background: linear-gradient(90deg, transparent, rgb(var(--acc) / .16), transparent); }
    .nav-links a { opacity: .78; transition: .2s; }
    .nav-links a:hover { opacity: 1; color: var(--accLight); }
    .lang { display: inline-flex; padding: 3px; border-radius: 12px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); font-size: 12px; font-weight: 800; }
    .lang span { display: inline-flex; align-items: center; gap: 5px; padding: 6px 9px; border-radius: 9px; transition: .25s; white-space: nowrap; opacity: .7; }
    .lang span.on { background: linear-gradient(135deg, rgb(var(--acc)), rgb(var(--acc2))); color: rgb(var(--onacc)); opacity: 1; box-shadow: 0 4px 14px -4px rgb(var(--acc) / .7); }
    .lang .flag { width: 16px; height: 11px; border-radius: 2px; flex-shrink: 0; }

    /* ---------- portada ---------- */
    .hero-velo { background:
      linear-gradient(180deg, rgb(var(--hero) / .35) 0%, transparent 25%, rgb(var(--hero) / .5) 76%, rgb(var(--hero)) 100%),
      linear-gradient(100deg, rgb(var(--hero) / .88) 0%, rgb(var(--hero) / .6) 48%, rgb(var(--hero) / .18) 100%),
      radial-gradient(700px 500px at 15% 40%, rgb(var(--acc) / .22), transparent 70%); }
    .kb { animation: kb 18s ease-out both; }
    @keyframes kb { from { transform: scale(1.15); } to { transform: scale(1); } }
    .float-y { animation: flotar 6s ease-in-out infinite; }
    @keyframes flotar { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

    /* ---------- botones: brillo y pulso ---------- */
    .btn-shine { position: relative; overflow: hidden; isolation: isolate; }
    .btn-shine::after { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
      background: linear-gradient(100deg, transparent 20%, rgba(255,255,255,.55) 50%, transparent 80%);
      transform: translateX(-130%); animation: brillo 3.4s ease-in-out infinite; }
    @keyframes brillo { 0%, 55% { transform: translateX(-130%); } 100% { transform: translateX(130%); } }
    .pulse { animation: pulso 2.4s infinite; }
    @keyframes pulso { 0% { box-shadow: 0 0 0 0 rgb(var(--acc) / .55); } 70% { box-shadow: 0 0 0 16px rgb(var(--acc) / 0); } 100% { box-shadow: 0 0 0 0 rgb(var(--acc) / 0); } }
    .btn-wa { background: linear-gradient(135deg, #25d366, #128c7e); color: #fff; box-shadow: 0 16px 30px -12px rgba(37,211,102,.7); }
    .btn-card { background: rgb(var(--ink)); color: rgb(var(--base)); }
    .btn-card:hover, .top .btn-card { background-image: linear-gradient(135deg, rgb(var(--acc)), rgb(var(--acc2))); color: rgb(var(--onacc)); }

    /* ---------- tarjetas de servicio ---------- */
    .tag-top { position: absolute; top: 16px; left: 16px; display: inline-flex; align-items: center; gap: 6px; border-radius: 999px;
               padding: 6px 12px; font-size: 12px; font-weight: 800; box-shadow: 0 10px 24px -8px rgba(0,0,0,.5); }
    .tag-star { background: linear-gradient(135deg, #fde68a, #f59e0b); color: #422006; }
    .check { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: rgba(16,185,129,.14); color: #10b981; font-size: 12px; flex-shrink: 0; }
    .check svg.lucide { stroke-width: 2.4; }

    /* ---------- portafolio bento ---------- */
    .bento { display: grid; gap: 14px; grid-template-columns: repeat(2, 1fr); grid-auto-rows: 170px; }
    .bento .t-a, .bento .t-cta { grid-column: span 2; }
    .bento .t-a { grid-row: span 2; }
    @media (min-width: 768px) {
      .bento { grid-template-columns: repeat(4, 1fr); grid-auto-rows: 230px; gap: 18px; }
      .bento .t-b, .bento .t-e { grid-column: span 2; }
    }
    /* La galería siempre visible: nunca depende de la animación de entrada */
    .bento, .bento .tile, .bento .tile img { opacity: 1 !important; visibility: visible; }
    .tile img { transition: transform 1.4s cubic-bezier(.2,.7,.2,1); }
    .tile:hover img { transform: scale(1.08); }
    .tile .flecha { opacity: 0; transform: translate(-6px, 6px); transition: .4s; }
    .tile:hover .flecha { opacity: 1; transform: none; }

    /* ---------- cabecera: estado en vivo + sello de Google ---------- */
    .vivo { display: inline-flex; align-items: center; gap: 8px; padding: 6px 13px 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; letter-spacing: .01em;
            background: rgba(16,185,129,.16); border: 1px solid rgba(52,211,153,.45); color: #a7f3d0; }
    .gbadge { display: inline-flex; align-items: center; gap: 10px; background: #fff; color: #1f2937; border-radius: 18px; padding: 8px 16px 8px 8px; text-decoration: none;
              box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 14px 34px -12px rgba(0,0,0,.55); transition: transform .2s; }
    .gbadge:hover { transform: translateY(-2px); }
    .gbadge-g { width: 42px; height: 42px; border-radius: 13px; background: #f1f3f4; display: grid; place-items: center; flex-shrink: 0; }
    .gbadge b { font: 900 24px/1 "Plus Jakarta Sans", sans-serif; color: #202124; }
    .gbadge small { display: block; margin-top: 3px; color: #5f6368; font-size: 12px; font-weight: 700; }

    /* ---------- selector visual de destacados (3 fotos conectadas al cotizador) ---------- */
    .dest-fila { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    @media (min-width: 640px) { .dest-fila { gap: 18px; } }
    .dest { position: relative; display: block; aspect-ratio: 3 / 4; border-radius: 22px; overflow: hidden; border: 0; padding: 0; cursor: pointer; text-align: left;
            background: rgb(var(--hero)); box-shadow: 0 2px 4px rgba(0,0,0,.08), 0 22px 44px -18px rgba(0,0,0,.6); outline: 3px solid transparent; outline-offset: 0;
            transition: transform .25s, outline-color .25s, box-shadow .3s; -webkit-tap-highlight-color: transparent; }
    @media (min-width: 640px) { .dest { aspect-ratio: 4 / 3; } }
    .dest img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 1.2s cubic-bezier(.2,.7,.2,1); }
    .dest:hover img { transform: scale(1.07); }
    .dest:active { transform: scale(.97); }
    .dest-velo { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 35%, rgba(0,0,0,.82)); }
    .dest-txt { position: absolute; left: 10px; right: 10px; bottom: 10px; color: #fff; line-height: 1.15; }
    .dest-txt b { display: block; font-family: var(--ft); font-size: 13px; font-weight: 800; }
    .dest-txt small { display: block; margin-top: 3px; font-size: 11px; font-weight: 700; color: rgba(255,255,255,.8); }
    @media (min-width: 640px) { .dest-txt { left: 16px; bottom: 14px; } .dest-txt b { font-size: 18px; } .dest-txt small { font-size: 13px; } }
    .dest-ok { position: absolute; top: 9px; right: 9px; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
               background: rgba(255,255,255,.22); border: 1.5px solid rgba(255,255,255,.75); color: transparent; backdrop-filter: blur(6px); transition: .25s; }
    .dest-ok svg.lucide { stroke-width: 3; }
    .dest.on { outline-color: rgb(var(--acc)); outline-offset: 3px; box-shadow: 0 0 0 7px rgb(var(--acc) / .2), 0 24px 48px -18px rgb(var(--acc) / .8); }
    .dest.on .dest-ok { background-image: linear-gradient(135deg, rgb(var(--acc)), rgb(var(--acc2))); border-color: transparent; color: rgb(var(--onacc)); animation: pop .4s cubic-bezier(.3,1.6,.5,1); }

    /* ---------- cotizador estilo Uber Eats (bento cards) ---------- */
    .menu { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    @media (min-width: 640px) { .menu { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; } }
    .bcard { position: relative; display: flex; flex-direction: column; text-align: left; padding: 0; border-radius: 20px; overflow: hidden; cursor: pointer;
             border: 1.5px solid rgb(var(--line)); background: rgb(var(--card)); color: rgb(var(--ink)); box-shadow: 0 1px 2px rgb(var(--shadow) / .06);
             transition: transform .2s, border-color .3s, box-shadow .35s; -webkit-tap-highlight-color: transparent; }
    .bcard:hover { transform: translateY(-2px); box-shadow: 0 12px 26px -14px rgb(var(--shadow) / .45); }
    .bcard:active { transform: scale(.97); }
    .bcard .bimg { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; background: rgb(var(--alt)); }
    .bcard .bbody { display: flex; flex-direction: column; gap: 8px; flex: 1; padding: 10px 12px 12px; min-width: 0; }
    .bcard .bname { font-weight: 800; font-size: 14px; line-height: 1.25; overflow-wrap: anywhere; }
    .bcard .bmeta { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 6px; margin-top: auto; }
    .bcard .bdur { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: rgb(var(--alt)); color: rgb(var(--muted)); white-space: nowrap; }
    .bcard .bprice { font-family: "Plus Jakarta Sans", sans-serif; font-weight: 900; font-size: 18px; line-height: 1; color: rgb(var(--tx)); white-space: nowrap; }
    .bcard .bprice small { display: block; font-size: 9.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: rgb(var(--muted)); margin-bottom: 2px; }
    .bcard .bpop { position: absolute; top: 8px; left: 8px; font-size: 11px; font-weight: 800; padding: 4px 9px; border-radius: 999px;
                   background: linear-gradient(135deg, #fde68a, #f59e0b); color: #422006; box-shadow: 0 8px 18px -8px rgba(0,0,0,.6); }
    .bcard .bok { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
                  background: rgba(255,255,255,.92); border: 1.5px solid rgba(0,0,0,.12); color: transparent; transition: background .25s, color .25s; }
    .bcard .bok svg.lucide { stroke-width: 3; }
    .bcard.on { border-color: rgb(var(--acc)); background: linear-gradient(rgb(var(--acc) / .07), rgb(var(--acc) / .07)), rgb(var(--card));
                box-shadow: 0 0 0 4px rgb(var(--acc) / .16), 0 18px 34px -16px rgb(var(--acc) / .9); }
    .bcard.on .bok { background-image: linear-gradient(135deg, rgb(var(--acc)), rgb(var(--acc2))); border-color: transparent; color: rgb(var(--onacc)); animation: pop .4s cubic-bezier(.3,1.6,.5,1); }
    /* bento: en el celular la primera (y la última si hace falta) ocupan todo el ancho */
    @media (max-width: 639px) {
      .bcard.ancho { grid-column: span 2; flex-direction: row; }
      .bcard.ancho .bimg { width: 42%; aspect-ratio: auto; min-height: 128px; flex-shrink: 0; }
      .bcard.ancho .bname { font-size: 15px; padding-right: 30px; }
    }
    /* en el cotizador se esconde el botón flotante de WhatsApp para no tapar el total */
    .wa-float { transition: transform .2s, opacity .25s; }
    body.en-cotizador .wa-float { opacity: 0; pointer-events: none; transform: scale(.6); }
    .campo.error .bcard { border-color: #ef4444; }
    /* barra del total (se queda pegada abajo mientras eliges) */
    .tbar { position: sticky; bottom: 12px; z-index: 5; margin-top: 14px; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 18px;
            background: rgb(var(--ink)); color: rgb(var(--base)); box-shadow: 0 18px 40px -16px rgba(0,0,0,.55); }
    body.con-barra .tbar { bottom: 74px; }
    .tbar-ico { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-size: 18px; flex-shrink: 0;
                background-image: linear-gradient(135deg, rgb(var(--acc)), rgb(var(--acc2))); }
    .tbar b { display: block; font-size: 14px; line-height: 1.2; }
    .tbar small { display: block; font-size: 11px; font-weight: 700; opacity: .7; }
    .tbar-num { margin-left: auto; text-align: right; font: 900 22px/1 "Plus Jakarta Sans", sans-serif; white-space: nowrap; }
    .tbar-num.bump { animation: bump .45s cubic-bezier(.3,1.6,.5,1); }
    @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.18); color: var(--accLight); } 100% { transform: scale(1); } }
    /* toques de lujo (estética) */
    [data-tema="lujo"] .bcard, [data-tema="lujo"] .chip { border-color: #eadccb; }
    [data-tema="lujo"] .bcard.on { border-color: rgb(var(--acc)); }
    [data-tema="lujo"] .bcard .bpop { background: linear-gradient(135deg, #f6d5c8, #c9967a); color: #3d2016; }

    /* ---------- sellos de pago ---------- */
    .pagos { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; }
    .pago { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 11px; border-radius: 10px; background: #fff; border: 1px solid #e5e7eb;
            font: 800 12.5px/1 "Plus Jakarta Sans", sans-serif; color: #111; white-space: nowrap; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
    .pago svg.lucide { width: 15px; height: 15px; }

    /* ---------- comparativa ---------- */
    .comparativa th, .comparativa td { padding: 14px 10px; text-align: center; border-top: 1px solid rgb(var(--line)); }
    .comparativa thead th { border-top: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: rgb(var(--muted)); }
    .comparativa td:first-child, .comparativa th:first-child { text-align: left; padding-left: 22px; font-weight: 600; }
    .comparativa .nos { background: rgb(var(--acc) / .09); }
    .comparativa thead .nos { color: rgb(var(--ink)); }
    .si, .no { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; font-size: 14px; }
    .si { background: #10b981; color: #fff; box-shadow: 0 6px 14px -6px rgba(16,185,129,.8); }
    .si svg.lucide, .no svg.lucide { stroke-width: 2.6; }
    .no { background: rgba(239,68,68,.12); color: #ef4444; }
    .tal { font-size: 12px; font-weight: 700; color: #d97706; }

    /* ---------- reseñas ---------- */
    .barra { height: 8px; border-radius: 99px; background: rgb(var(--line)); overflow: hidden; }
    .barra i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #fbbf24, #f59e0b); }

    /* ---------- FAQ ---------- */
    summary::-webkit-details-marker { display: none; }
    .acc { background: rgb(var(--card)); border: 1px solid rgb(var(--line)); transition: border-color .3s, box-shadow .3s; }
    .acc:hover { border-color: rgb(var(--acc) / .45); }
    .acc[open] { border-color: rgb(var(--acc) / .8); box-shadow: 0 0 0 4px rgb(var(--acc) / .1), 0 20px 44px -20px rgb(var(--acc) / .6); }
    .faq-ico { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; flex-shrink: 0; transition: transform .35s, background .3s; }
    .acc[open] .faq-ico { transform: rotate(45deg); background-image: linear-gradient(135deg, rgb(var(--acc)), rgb(var(--acc2))); color: rgb(var(--onacc)); box-shadow: none; }

    /* ---------- cotizador tipo app nativa ---------- */
    .cot-bg { background:
      radial-gradient(600px 420px at 8% 8%, rgb(var(--acc) / .32), transparent 62%),
      radial-gradient(560px 520px at 95% 95%, rgb(var(--acc2) / .28), transparent 62%),
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px) 0 0 / 44px 44px,
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px) 0 0 / 44px 44px; }
    .marco { padding: 1.5px; border-radius: 2rem;
             background: linear-gradient(140deg, rgb(var(--acc) / .95), rgba(255,255,255,.18) 38%, rgba(255,255,255,.06) 62%, rgb(var(--acc2) / .9));
             box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 10px 20px -6px rgba(0,0,0,.25), 0 34px 70px -24px rgba(0,0,0,.55), 0 70px 140px -50px rgb(var(--acc) / .45); }
    .marco > form { border-radius: calc(2rem - 1.5px); }
    .paso { display: flex; align-items: center; gap: 10px; font-family: var(--ft); font-weight: 700; font-size: 17px; margin-bottom: 12px; }

      return `
      <footer class="bg-[#07080c] text-white/65 pt-16 pb-28">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 grid gap-10 md:grid-cols-[1.4fr_1fr_1fr]">
          <div>
            <div class="flex items-center gap-3"><span class="grad grid place-items-center w-10 h-10 rounded-xl text-onacc text-lg">${ic(G.logo)}</span><b class="font-display text-xl text-white">${esc(NEGOCIO)}</b></div>
            <p class="mt-4 text-sm max-w-sm">${esc(L(G.slogan))}</p>
            <div class="mt-5 flex flex-wrap gap-2">${G.sellos.slice(0, 2).map(k => `<span class="inline-flex items-center gap-2 rounded-full border border-white/15 px-3 py-1.5 text-xs font-semibold text-white/80"><span style="color:var(--accLight)">${ic(SELLO[k][0])}</span> ${L(SELLO[k][1])}</span>`).join("")}</div>
          </div>
          <div><b class="text-white font-display">${U.pieLinks}</b>
            <ul class="mt-4 space-y-2 text-sm">${U.nav.map((t, i) => `<li><a class="hover:text-white transition" href="#${SECC[i]}">${t}</a></li>`).join("")}</ul></div>
          <div><b class="text-white font-display">${U.pieContacto}</b>
            <p class="mt-4 text-sm">${esc(L(G.etiqueta))}</p>
            ${CIUDAD ? `<p class="text-sm mt-1 flex items-center gap-1.5">${ic("map-pin")} ${esc(CIUDAD)}</p>` : ""}
            <p class="text-sm mt-1 flex items-center gap-1.5">${ic("phone")} <a class="hover:text-white" href="tel:+${WHATSAPP}">${telBonito(WHATSAPP)}</a></p>
            <p class="text-sm mt-1">${U.horario}</p>
            <button id="pieWa" type="button" class="mt-5 btn-wa inline-flex items-center gap-2 rounded-xl px-4 py-3 text-sm font-bold">${wa()} ${U.pieWa}</button></div>
        </div>
        <div class="max-w-6xl mx-auto px-4 sm:px-6 mt-10"><p class="text-center text-[11px] font-bold uppercase tracking-[.16em] text-white/50 mb-3">${U.aceptamos}</p>${pagos(U)}</div>
        <div class="max-w-6xl mx-auto px-4 sm:px-6 mt-12 pt-6 border-t border-white/10 text-xs flex flex-wrap gap-2 justify-between">
          <span>© ${new Date().getFullYear()} ${esc(NEGOCIO)} · ${U.derechos}</span><span>${L(SELLO.licensed[1])} · ${L(SELLO.estimados[1])}</span>
        </div>
      </footer>`;
    }

    // Barra fija abajo: el prospecto le manda SMS a Marcos para cargar sus precios reales (no sale en la web final ni en la captura)
    const SMS_MARCOS = "+13059269442";
    const CON_BARRA = !FINAL && VISTA !== "captura";
    function barraMarcos() {
      if (!CON_BARRA) return "";
      const texto = L([`✨ Demo hecha para ${NEGOCIO} — <u>Toca aquí para cargar tus precios reales y tu logo gratis</u>`,
                       `✨ Demo built for ${NEGOCIO} — <u>Tap here to load your real prices &amp; logo for free</u>`]);
      const cuerpo = L([`Hola Marcos, acabo de ver la página de muestra de ${NEGOCIO} y quiero cargar mis precios reales.`,
                        `Hi Marcos, I just checked out the demo page for ${NEGOCIO} and want to load my real prices.`]);
      return `<a class="barra-marcos" href="sms:${SMS_MARCOS}?&body=${encodeURIComponent(cuerpo)}">${texto.replace(NEGOCIO, esc(NEGOCIO))}</a>`;
    }

    // ====== DIBUJAR LA PÁGINA ======
    let primera = true, contado = false;
    function render() {
      const U = UI[LANG];
      const y = scrollY;
      document.documentElement.lang = LANG;
      document.title = `${NEGOCIO} | ${L(G.etiqueta)}`;
      $("app").innerHTML = [hdr(U), hero(U), destacados(U), stats(U), nosotros(U), servicios(U), portafolio(U), porQue(U), resenas(U), faq(U), cobertura(U), cotizar(U), pie(U), barraMarcos()].join("");
      document.body.classList.toggle("con-barra", CON_BARRA);
      if (window.IntersectionObserver) {
        if (window.__ioCot) __ioCot.disconnect();
        window.__ioCot = new IntersectionObserver(es => document.body.classList.toggle("en-cotizador", es[0].isIntersecting), { threshold: .05 });
        __ioCot.observe($("cotizar"));
      }
      pintarIconos();
      $("waFlotante").setAttribute("aria-label", U.waAria);
      if (primera) { primera = false; observar(); }
      else { document.querySelectorAll(".reveal").forEach(e => e.classList.add("in")); contar(true); scrollTo(0, y); }
      progreso();
    }

    // Animación al hacer scroll (fade-up) + contadores
    function observar() {
      if (!("IntersectionObserver" in window)) { document.querySelectorAll(".reveal").forEach(e => e.classList.add("in")); contar(true); return; }
      const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }),
        { threshold: .12, rootMargin: "0px 0px -40px 0px" });
      document.querySelectorAll(".reveal").forEach(e => io.observe(e));
      const ioS = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) { contar(); ioS.disconnect(); } }, { threshold: .35 });
      ioS.observe($("stats"));
    }
    function contar(final) {
      document.querySelectorAll("[data-count]").forEach(el => {
        const n = +el.dataset.count;
        if (final || contado) { el.textContent = n.toLocaleString("en-US"); return; }
        const t0 = performance.now(), dur = 1900;
        const paso = t => { const p = Math.min(1, (t - t0) / dur); el.textContent = Math.round(n * (1 - Math.pow(1 - p, 3))).toLocaleString("en-US"); if (p < 1) requestAnimationFrame(paso); };
        requestAnimationFrame(paso);
      });
      contado = true;
    }

    // ====== LÓGICA DEL COTIZADOR ======
    function valor(c) {
      const U = UI[LANG], v = ESTADO[c.id];
      if (c.tipo === "servicio") return listaSel();
      if (c.tipo === "chips") return v === undefined ? "" : L(c.opciones[v]);
      if (c.tipo === "entrega") { const dir = String(ESTADO.direccion || "").trim(); return v === 1 ? `${U.deliveryMsg}${dir ? ": " + dir : ""}` : U.pickupMsg; }
      const s = String(v || "").trim();
      if (c.tipo === "fecha" && s) { const [a, m, d] = s.split("-"); return `${m}/${d}/${a}`; }
      if (c.tipo === "hora" && s) { let [h, mi] = s.split(":").map(Number); const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; return `${h}:${String(mi).padStart(2, "0")} ${ap}`; }
      return s;
    }
    const listaSel = () => ESTADO.sel.map(i => `${nombreServ(G.serv.lista[i])} (${L(G.serv.lista[i].ref)})`).join(", ");
    function falta(c) {
      if (c.id === "pedido" && ESTADO.sel.length) return false;   // ya eligió platillos en las tarjetas
      if (c.tipo === "entrega") return ESTADO.entrega === 1 && !String(ESTADO.direccion || "").trim();
      if (c.tipo === "tel") return String(ESTADO.telefono || "").replace(/\D/g, "").length < 10;
      return !!c.req && !valor(c);
    }
    function progreso() {
      const req = G.form.campos.filter(c => c.req);
      const pct = Math.round(100 * req.filter(c => !falta(c)).length / req.length);
      if ($("progBar")) { $("progBar").style.width = pct + "%"; $("progTxt").textContent = pct + "%"; }
    }
    const marcarChips = id => document.querySelectorAll(`[data-chips="${id}"] .chip`).forEach(b => b.classList.toggle("on", +b.dataset.i === ESTADO[id]));
    const limpiarError = id => document.querySelector(`[data-campo="${id}"]`)?.classList.remove("error");

    function validar() {
      let primero = null;
      G.form.campos.forEach(c => {
        const caja = document.querySelector(`[data-campo="${c.id}"]`), malo = falta(c);
        caja.classList.toggle("error", malo);
        if (malo && !primero) primero = caja;
      });
      if (primero) { avisar(UI[LANG].completa, false); primero.scrollIntoView({ behavior: "smooth", block: "center" }); return false; }
      return true;
    }
    function armarMensaje(tipo) {
      const U = UI[LANG];
      const orden = [...G.form.campos].sort((a, b) => (a.id === "nombre" ? 0 : a.id === "telefono" ? 1 : 2) - (b.id === "nombre" ? 0 : b.id === "telefono" ? 1 : 2));
      let cuerpo = orden.map(c => {
        const lab = L(c.label).replace(/\s*\((opcional|optional)\)/i, "");
        return `*${lab}${lab.endsWith("?") ? "" : ":"}* ${valor(c) || "—"}`;
      }).join("\n");
      if (ESTADO.sel.length) {
        if (!G.form.campos.some(c => c.tipo === "servicio")) cuerpo = `*${U.selMsg}:* ${listaSel()}\n` + cuerpo;
        cuerpo += `\n*${totalDesde() ? U.totalDesde : U.totalTxt}:* ${dinero(sumaTotal())}`;
      }
      const tel = String(ESTADO.telefono || "").trim();
      return tipo === "llamada"
        ? `📞 *${U.llamada} — ${L(G.form.tituloForm)}*\n*${U.para}:* ${NEGOCIO}\n\n${cuerpo}\n\n${U.llamame(tel)}`
        : `${G.emoji} *${L(G.form.tituloForm)}*\n*${U.para}:* ${NEGOCIO}\n\n${cuerpo}\n\n${U.gracias}`;
    }
    const abrirWa = texto => window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(texto)}`, "_blank");

    // Total animado de la barra de cotización
    let totalMostrado = 0, rafTotal;
    function animarTotal() {
      const el = $("tTotal"); if (!el) return;
      const U = UI[LANG], meta = sumaTotal(), desde = totalMostrado, t0 = performance.now();
      $("tCount").textContent = U.nSel(ESTADO.sel.length);
      $("tLbl").textContent = totalDesde() ? U.totalDesde : U.totalTxt;
      el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump");
      cancelAnimationFrame(rafTotal);
      const paso = t => { const p = Math.min(1, (t - t0) / 450), v = desde + (meta - desde) * (1 - Math.pow(1 - p, 3));
        el.textContent = dinero(p < 1 ? Math.round(v) : meta); if (p < 1) rafTotal = requestAnimationFrame(paso); else totalMostrado = meta; };
      rafTotal = requestAnimationFrame(paso);
    }
    // Pinta tarjetas y fotos destacadas según la selección
    function marcarServ() {
      document.querySelectorAll("[data-serv]").forEach(b => { const on = ESTADO.sel.includes(+b.dataset.serv); b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); });
      document.querySelectorAll("[data-dest]").forEach(b => { const on = ESTADO.sel.includes(+b.dataset.dest); b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); });
    }
    // Agrega o quita un servicio del cotizador (forzar = solo agregar)
    function alternar(k, forzar) {
      const s = G.serv.lista[k], ya = ESTADO.sel.includes(k);
      if (ya && forzar) return;
      ESTADO.sel = ya ? ESTADO.sel.filter(i => i !== k) : [...ESTADO.sel, k];
      if (!ya && CAMPO_SERV && CAMPO_SERV.tipo !== "servicio" && s.o !== undefined) { ESTADO[CAMPO_SERV.id] = s.o; marcarChips(CAMPO_SERV.id); limpiarError(CAMPO_SERV.id); }
      if (CAMPO_SERV && CAMPO_SERV.tipo === "servicio") limpiarError(CAMPO_SERV.id);
      if (ESTADO.sel.length) limpiarError("pedido");
      marcarServ(); animarTotal(); progreso();
      avisar(`${nombreServ(s)} ${ya ? UI[LANG].quitado : UI[LANG].agregado}`, !ya);
    }
    // Botón de la tarjeta grande de servicios → lo suma al cotizador y baja
    function elegir(k) {
      alternar(k, true);
      $("cotizar").scrollIntoView({ behavior: "smooth" });
    }

    // ====== EVENTOS (una sola vez; la página se redibuja al cambiar de idioma) ======
    document.addEventListener("click", e => {
      const t = e.target;
      if (t.closest("#langBtn")) {
        LANG = LANG === "es" ? "en" : "es";
        try { localStorage.setItem("vc_lang", LANG); } catch (err) {}
        document.documentElement.classList.add("ya");
        render(); return;
      }
      const card = t.closest("[data-elegir]");
      if (card) { elegir(+card.dataset.elegir); return; }
      const bc = t.closest("[data-serv]");
      if (bc) { alternar(+bc.dataset.serv); return; }
      const ds = t.closest("[data-dest]");
      if (ds) { alternar(+ds.dataset.dest); return; }
      const ch = t.closest(".chip");
      if (ch) {
        const id = ch.closest("[data-chips]").dataset.chips;
        ESTADO[id] = +ch.dataset.i; marcarChips(id); limpiarError(id);
        if (id === "entrega") { $("dirCaja").classList.toggle("hidden", ESTADO.entrega !== 1); if (ESTADO.entrega === 1) $("f_direccion").focus(); }
        progreso(); return;
      }
      if (t.closest("#btnEnviarWa")) { if (validar()) abrirWa(armarMensaje("whatsapp")); return; }
      if (t.closest("#btnLlamar")) { if (validar()) abrirWa(armarMensaje("llamada")); return; }
      // SMS (Text Message): mismo pedido, sin los asteriscos de WhatsApp. "?&body=" funciona en iPhone y Android.
      if (t.closest("#btnSms")) { if (validar()) location.href = `sms:+${WHATSAPP}?&body=${encodeURIComponent(armarMensaje("whatsapp").replace(/\*/g, ""))}`; return; }
      if (t.closest("#pieWa") || t.closest("#faqWa")) { abrirWa(UI[LANG].saludo(NEGOCIO)); return; }
      if (t.closest("#waFlotante")) { $("cotizar").scrollIntoView({ behavior: "smooth" }); }
    });
    document.addEventListener("input", e => {
      const el = e.target;
      if (!el.classList.contains("inp")) return;
      const id = el.id.replace(/^f_/, "");
      ESTADO[id] = el.value;
      limpiarError(id === "direccion" ? "entrega" : id);
      progreso();
    });
    addEventListener("scroll", () => document.documentElement.classList.toggle("solid", scrollY > 10), { passive: true });

    let tAviso;
    function avisar(txt, ok = true) {
      const a = $("aviso");
      a.innerHTML = (ok ? CHECK_SVG : "") + "<span></span>";
      a.querySelector("span").textContent = txt;
      a.classList.add("ver");
      clearTimeout(tAviso); tAviso = setTimeout(() => a.classList.remove("ver"), 2000);
    }

    render();
    requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.add("listo")));

    // ====== RADAR: avisa a tu panel que el prospecto abrió su web (una vez por visita) ======
    // No avisa en tu computadora (localhost), en la captura del robot ni en la página final del cliente (&vista=...).
    if (clienteURL && !VISTA && /^https?:$/.test(location.protocol) && !/^(localhost|127\.|192\.168\.|10\.)/.test(location.hostname)) {
      let nueva = true;
      try { const k = "vc_radar" + location.search; nueva = !sessionStorage.getItem(k); sessionStorage.setItem(k, "1"); } catch (e) {}
      if (nueva) fetch(`https://ntfy.sh/${RADAR_TOPIC}`, { method: "POST", body: JSON.stringify({ t: TEL_DUENO, c: NEGOCIO, g: GIRO_ID }), keepalive: true }).catch(() => {});
    }
  </script>
</body>
</html>
